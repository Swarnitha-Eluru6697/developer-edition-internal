# Builds the InaiEra image(s) for this repo on every push to dev and uploads them to GHCR.
# Tag format: 1.0.0-<first 7 characters of the commit>, same as the setup guide.
# Run it by hand for any branch from the Actions tab (workflow_dispatch).
name: Build image

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image installs private GitHub code. An org secret that isn't shared
      # with this repo arrives EMPTY, and the build then dies deep inside pip
      # with a bare "exit code: 1" — stop here with the actual fix instead.
      - name: Check the private-code token is available
        env:
          TOKEN: ${{ secrets.INAIERA_SOURCE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error title=INAIERA_SOURCE_TOKEN missing::The secret is empty for ${GITHUB_REPOSITORY}. Org Settings > Secrets and variables > Actions > INAIERA_SOURCE_TOKEN > Repository access: add ${GITHUB_REPOSITORY#*/} (or create a repo secret with that name holding a repo-scope token)."
            exit 1
          fi

      - name: Work out the image tag
        id: t
        run: echo "tag=1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # requirements.txt installs private repos (gateway-auth); the Dockerfile reads the
      # token from the gh_token build secret. Org secret: INAIERA_SOURCE_TOKEN (repo scope).
      - name: Build and push agenticworkflow-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/aadhyaanalyticsinc/inaiera/agenticworkflow-backend:${{ steps.t.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          secrets: |
            gh_token=${{ secrets.INAIERA_SOURCE_TOKEN }}
