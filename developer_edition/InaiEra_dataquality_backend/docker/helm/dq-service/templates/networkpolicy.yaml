{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dq.fullname" . }}
  labels:
    {{- include "dq.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dq.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Metadata Postgres
    - to:
        - namespaceSelector:
            {{- toYaml .Values.database.egress.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.database.egress.podSelector | nindent 12 }}
      ports:
        - { protocol: TCP, port: {{ .Values.database.port }} }
    # Redis
    - to:
        - namespaceSelector:
            {{- toYaml .Values.redis.egress.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.redis.egress.podSelector | nindent 12 }}
      ports:
        - { protocol: TCP, port: {{ .Values.redis.port }} }
    {{- range $name, $i := .Values.integrations }}
    {{- if $i.enabled }}
    # integration: {{ $name }}
    - to:
        - namespaceSelector:
            {{- toYaml $i.egress.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $i.egress.podSelector | nindent 12 }}
      ports:
        {{- range $i.egress.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
    {{- end }}
    # Control-plane JWKS (HTTPS)
    - to:
        - ipBlock:
            cidr: {{ .Values.controlPlane.egressCidr }}
      ports:
        - { protocol: TCP, port: 443 }
{{- end }}
