# REQUIRED per data plane. Rendering fails while this is empty/placeholder.
tenant:
  orgId: "REPLACE_ME"
  cloud: "aws"
  region: "us-east-1"

environment: prod   # dev | staging | prod  (-> ENVIRONMENT)

image:
  repository: registry.inaiera.com/products/data-quality
  tag: "0.2.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: inaiera-registry

replicas: 2

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  create: true
  name: ""

# Container hardening (enforced by values.schema.json — cannot be weakened).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

tmpVolume:
  sizeLimit: 64Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 8086

database:
  host: "postgres.dp-shared.svc.cluster.local"
  port: 5432
  name: "dataquality"
  user: "dataquality"
  passwordSecretRef:
    name: "dq-db-credentials"
    key: "password"
  # NetworkPolicy egress target for the database.
  egress:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: dp-shared
    podSelector:
      matchLabels:
        app: postgres

redis:
  url: "redis://redis.dp-shared.svc.cluster.local:6379/4"
  port: 6379
  egress:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: dp-shared
    podSelector:
      matchLabels:
        app: redis

# DQ-CFG-001 / DQ-AUTH-012: every integration has an explicit URL, its own
# audience and its OWN signing-secret reference (distinct Secrets). When an
# integration is enabled, url + serviceJwtSecret are REQUIRED (render fails
# otherwise) and the pod fails startup/readiness if they are unusable.
integrations:
  ucs:
    enabled: true
    url: "http://catalog.dp-shared.svc.cluster.local:8000"
    audience: "ucs"
    bindAction: "dq.bind"
    # UCS service-JWT contract (dataset resolve/authz, check registrations,
    # audit events). Off until UCS ships it; outbox rows stay pending.
    contractV2Enabled: false
    serviceJwtSecret:          # -> UCS_SERVICE_JWT_SECRET
      name: "dq-ucs-service-jwt"
      key: "secret"
    egress:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dp-shared
      podSelector:
        matchLabels:
          app: catalog
      ports: [8000]
  dbtRunner:
    enabled: true
    url: "http://dbtrunner.dp-shared.svc.cluster.local:80"
    audience: "dbtrunner"
    engineVersion: "1.10.0"
    serviceJwtSecret:          # -> DBTRUNNER_SERVICE_JWT_SECRET (= runner SERVICE_JWT_SECRET)
      name: "dq-dbtrunner-service-jwt"
      key: "secret"
    egress:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dp-shared
      podSelector:
        matchLabels:
          app: dbtrunner
      ports: [80, 8080]
  flinkRunner:
    enabled: true
    url: "http://flinksql-runner.dp-shared.svc.cluster.local:80"
    audience: "flinksql-runner"
    serviceJwtSecret:          # -> FLINKSQL_SERVICE_JWT_SECRET
      name: "dq-flinksql-service-jwt"
      key: "secret"
    egress:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dp-shared
      podSelector:
        matchLabels:
          app: flinksql-runner
      ports: [80, 8080]

# Optional: signing secret for Workspace -> DQ scoped service tokens
# (/api/v1/render/validate/rule). -> INBOUND_SERVICE_JWT_SECRET
inboundServiceJwtSecret:
  name: ""
  key: "secret"

# DQ-CONTRACT-005: must equal the FlinkSQL runner's values (shared contract).
qualityContract:
  version: "2.0"
  resultsTopic: "dq.quality.results.v2"
  gateTopic: "dq.quality.gate.v2"
  quarantineTopic: "dq.quality.quarantine.v2"

controlPlane:
  jwksUrl: "https://www.app.inaiera.com/.well-known/jwks.json"
  issuer: "https://www.app.inaiera.com"
  audience: "workspace.inaiera"
  egressCidr: "0.0.0.0/0"

seedSystemRules: true

migrations:
  # Helm pre-install/pre-upgrade Job runs `alembic upgrade head` once, instead
  # of every replica racing to migrate on start.
  job: true

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dp-shared

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
