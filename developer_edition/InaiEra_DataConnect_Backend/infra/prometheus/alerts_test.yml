# promtool test rules alerts_test.yml  — proves the DataConnect alerts fire (and stay quiet) on the series they are written for.
rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      # one invalid result at minute 2, on pipeline_deploy; nothing for pipeline_pause
      - series: 'dataconnect_operation_result_invalid_total{service="dataconnect",operation="pipeline_deploy"}'
        values: '0 0 1 1 1 1'
      - series: 'dataconnect_operation_result_invalid_total{service="dataconnect",operation="pipeline_pause"}'
        values: '0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: DataConnectOperationResultInvalid
        exp_alerts: []
      - eval_time: 4m
        alertname: DataConnectOperationResultInvalid
        exp_alerts:
          - exp_labels: {severity: warning, operation: pipeline_deploy}
            exp_annotations:
              summary: "pipeline_deploy succeeded but returned an invalid result"
              description: "An operation of type pipeline_deploy completed its action but its result failed the contract check, so it was recorded with result_status=invalid (error_code OPERATION_RESULT_INVALID). The resource's state is fine; the operation's result is missing."
  - interval: 1m
    input_series:
      - series: 'dataconnect_quality_blocked_partitions{service="dataconnect"}'
        values: '0 0 2 2 2 2 2 2 2 2'
    alert_rule_test:
      - eval_time: 5m          # blocked for only ~3 minutes: not yet
        alertname: DataConnectQualityWorkerBlocked
        exp_alerts: []
      - eval_time: 9m          # blocked for more than 5 minutes
        alertname: DataConnectQualityWorkerBlocked
        exp_alerts:
          - exp_labels: {severity: warning, service: dataconnect}
            exp_annotations:
              summary: "A DataConnect quality worker has been stuck for 5 minutes"
              description: "2 partition(s) cannot advance because their quality worker cannot dead-letter a record. Check the Kafka broker and the worker dead-letter topic. Pipelines go DEGRADED after DATACONNECT_QUALITY_STREAM_DEGRADED_AFTER_SECONDS."
