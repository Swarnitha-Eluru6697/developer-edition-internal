{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "workspace.serviceAccountName" . }}
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "workspace.fullname" . }}
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "workspace.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

{{- if .Values.migrations.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "workspace.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        # Not workspace.selectorLabels: the API Service selects those, and
        # must never route requests to a migration pod.
        app.kubernetes.io/name: {{ include "workspace.name" . }}-migrate
        app.kubernetes.io/instance: {{ include "workspace.fullname" . }}-migrate
        job: migrate
        inaiera.com/product: workspace
        inaiera.com/org-id: {{ .Values.tenant.orgId | quote }}
    spec:
      restartPolicy: Never
      {{- include "workspace.podSpecSecurity" . | nindent 6 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["alembic", "upgrade", "head"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # Self-contained env, NOT envFrom the ConfigMap: this is a
          # pre-install hook, so on a first install the ConfigMap doesn't
          # exist yet. Migrations need only the database settings.
          env:
            - name: ENVIRONMENT
              value: "prod"
            - name: ORG_ID
              value: {{ .Values.tenant.orgId | quote }}
            - name: DATABASE_URL
              value: {{ include "workspace.databaseUrl" . | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecretRef.name }}
                  key: {{ .Values.database.passwordSecretRef.key }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/workspace
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: home
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
