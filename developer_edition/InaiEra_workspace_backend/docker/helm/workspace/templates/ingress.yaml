{{- /*
W-001: Workspace only accepts identity injected by the trusted gateway (values.yaml `gateway`).
This Ingress must therefore be served by that gateway or forward through it: a request that
reaches the pod without X-Inaiera-Gateway-Secret is refused with 401.
*/}}
{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "workspace.fullname" . }}
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ tpl .Values.ingress.host . | quote }}
      secretName: {{ tpl .Values.ingress.tls.secretName . | quote }}
  {{- end }}
  rules:
    - host: {{ tpl .Values.ingress.host . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "workspace.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
