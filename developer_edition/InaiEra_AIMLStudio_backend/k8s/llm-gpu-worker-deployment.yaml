apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-studio-llm-gpu-worker
spec:
  replicas: 1
  selector: {matchLabels: {app: ml-studio-llm-gpu-worker}}
  template:
    metadata: {labels: {app: ml-studio-llm-gpu-worker}}
    spec:
      containers:
        - name: worker
          image: ml-studio-backend:2.36.3-cuda
          command: ["node", "dist/worker.js"]
          env:
            - {name: WORKER_COMPUTE_PROFILES, value: "gpu-1x,gpu-4x"}
            - {name: WORKER_CONCURRENCY, value: "1"}
            - {name: HPO_WORKER_CONCURRENCY, value: "1"}
          resources:
            limits:
              nvidia.com/gpu: 1
      nodeSelector:
        accelerator: nvidia
