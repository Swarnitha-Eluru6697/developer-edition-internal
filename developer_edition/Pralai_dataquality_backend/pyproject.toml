[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "inaiera-data-quality"
version = "0.2.0"
description = "InAiEra Data Quality — cross-stack rule registry, rulesets, bindings, and rendering"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  # migrations/env.py (sync_migration_url) rewrites DATABASE_URL to an explicit
  # postgresql+psycopg2:// URL for Alembic. It must be explicit: SQLAlchemy 2.1
  # made psycopg (v3) the default for a bare postgresql:// URL.
  "psycopg2-binary>=2.9",
  "redis>=5.0",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.3",
  "mypy>=1.9",
  "cryptography>=42",
  "respx>=0.21",
]
prod = ["gunicorn>=22.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
