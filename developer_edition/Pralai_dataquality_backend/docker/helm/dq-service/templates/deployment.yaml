{{- include "dq.validate" . }}
{{- $ucs := .Values.integrations.ucs }}
{{- $dbt := .Values.integrations.dbtRunner }}
{{- $flink := .Values.integrations.flinkRunner }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dq.fullname" . }}
  labels:
    {{- include "dq.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dq.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dq.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "dq.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: data-quality
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8086
          # Startup fails (pod crash-loops with the reason in its log) when an
          # enabled integration is misconfigured; readiness re-checks it.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: {{ include "dq.fullname" . }}-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecretRef.name }}
                  key: {{ .Values.database.passwordSecretRef.key }}
            {{- if $ucs.enabled }}
            - name: UCS_SERVICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $ucs.serviceJwtSecret.name }}
                  key: {{ $ucs.serviceJwtSecret.key }}
            {{- end }}
            {{- if $dbt.enabled }}
            - name: DBTRUNNER_SERVICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $dbt.serviceJwtSecret.name }}
                  key: {{ $dbt.serviceJwtSecret.key }}
            {{- end }}
            {{- if $flink.enabled }}
            - name: FLINKSQL_SERVICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $flink.serviceJwtSecret.name }}
                  key: {{ $flink.serviceJwtSecret.key }}
            {{- end }}
            {{- if .Values.inboundServiceJwtSecret.name }}
            - name: INBOUND_SERVICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.inboundServiceJwtSecret.name }}
                  key: {{ .Values.inboundServiceJwtSecret.key }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit }}
