name: CI

# Repository model: DataConnect ships as two independently owned, independently
# versioned repositories — this one (backend, FastAPI, code at repo root) and
# AadhyaAnalyticsInc/Pralai_DataConnect_Frontend (React/Vite, also at its own
# repo root) — not a monorepo. There is no combined checkout with backend/ and
# frontend/ subdirectories (this workflow used to assume one and pointed
# working-directory at both, which never matched either repo's actual layout).
# Each repo owns its own lint/typecheck/test/build/docker-build workflow —
# this file only ever touches this repo's own code.
#
# The one thing that does span both repos is whether they still agree on the
# HTTP contract between them, which the contract-check job below verifies by
# regenerating the frontend's OpenAPI-derived TypeScript types against this
# backend's current schema and failing if they've drifted from what's
# committed in the frontend repo. See docs/REPOSITORY_MODEL.md for the full
# rationale and the frontend repo's own ci.yml for its half of this model.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          pip install -e ".[dev]"
          rm -f ~/.gitconfig
      - name: Ruff lint
        run: ruff check app tests
      - name: Ruff format check
        run: ruff format --check app tests
      - name: Mypy type check
        run: mypy app

  backend-test:
    name: Backend — Tests & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dataconnect_test
          POSTGRES_USER: dataconnect
          POSTGRES_PASSWORD: dataconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          pip install -e ".[dev]"
          rm -f ~/.gitconfig
      - name: Run tests with coverage
        env:
          DATACONNECT_DATABASE_URL: postgresql+asyncpg://dataconnect:dataconnect@localhost:5432/dataconnect_test
        run: pytest --cov=app --cov-report=xml --cov-fail-under=70
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: docker build --secret id=gh_token,env=GH_TOKEN -t dataconnect-backend:ci .

  # ── Cross-repo contract check ────────────────────────────────────────────
  # Confirms the two repos are still compatible without requiring them to
  # share a version number: the frontend's committed
  # src/types/dataconnect-api.generated.ts is regenerated from *this*
  # backend's current OpenAPI schema (no live server/DB needed — the schema
  # is derived straight from the route definitions) and diffed against what
  # the frontend repo actually has checked in. A diff means the frontend was
  # built against a since-changed contract and needs `npm run gen:api-types`
  # + a commit before the two are compatible again.
  #
  # Requires a `FRONTEND_REPO_TOKEN` repo secret: a fine-grained PAT (or a
  # GitHub App installation token) with read access to
  # AadhyaAnalyticsInc/Pralai_DataConnect_Frontend — the default
  # GITHUB_TOKEN in this repo's Actions runs cannot check out a sibling repo.
  # Add it under Settings → Secrets and variables → Actions.
  contract-check:
    name: Cross-repo API contract check
    runs-on: ubuntu-latest
    needs: [backend-test]
    env:
      NODE_VERSION: "20"
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: backend
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: AadhyaAnalyticsInc/Pralai_DataConnect_Frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Dump this backend's current OpenAPI schema
        working-directory: backend
        run: |
          python -c "
          import json
          from app.main import app
          json.dump(app.openapi(), open('openapi.json', 'w'))
          "
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Fail if the frontend's permission list has drifted from this backend's permissions.json
        working-directory: frontend
        env:
          DATACONNECT_PERMISSIONS_FILE: ../backend/permissions.json
        run: npm run check:access-contract
      - name: Regenerate frontend API types from the backend's current schema
        working-directory: frontend
        env:
          DATACONNECT_OPENAPI_URL: ../backend/openapi.json
        run: npm run gen:api-types
      - name: Fail if the frontend's committed types have drifted from the backend's contract
        working-directory: frontend
        run: |
          if ! git diff --quiet -- src/types/dataconnect-api.generated.ts; then
            echo "::error::The frontend's committed OpenAPI types no longer match this backend's current schema."
            echo "Run 'npm run gen:api-types' in the frontend repo against this backend and commit the result."
            git diff -- src/types/dataconnect-api.generated.ts
            exit 1
          fi
