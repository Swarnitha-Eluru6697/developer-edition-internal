# Production config for the Agentic Workflow app when it runs as a Module-Federation
# REMOTE inside the data plane (service `agenticworkflow-frontend`).
#
# Like ./nginx.conf it proxies nothing: in the data plane Envoy does all routing
# and header injection, so this server does exactly one job — serve dist/.
#
# The cache rules are the point of this file. Serving dist/ from the stock
# nginx.conf sends NO Cache-Control at all, so browsers fall back to heuristic
# caching. That is harmless for the hashed chunks but not for remoteEntry.js:
# its filename never changes, so a heuristically-cached copy keeps pointing at
# the PREVIOUS build's hashed chunks, which it also has cached — and the host
# portal then renders the entire old UI from disk cache without ever asking the
# server. A deploy looks like it did nothing.

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The federation entry point. Fixed filename, so it MUST be revalidated on
  # every load or a new deploy is invisible to returning browsers. no-cache does
  # not mean "don't store" — the ETag still makes this a cheap 304.
  location = /assets/remoteEntry.js {
    add_header Cache-Control "no-cache" always;
  }

  # Same reasoning: unhashed name, points at hashed assets.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # Everything else under /assets/ carries a content hash in its filename, so a
  # changed file is a changed URL and this can be cached hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # SPA fallback for standalone browsing of the remote.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
