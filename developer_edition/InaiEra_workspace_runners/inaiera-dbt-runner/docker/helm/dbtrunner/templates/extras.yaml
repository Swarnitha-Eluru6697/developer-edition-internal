{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dbtrunner.serviceAccountName" . }}
  labels:
    {{- include "dbtrunner.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

{{- if .Values.runner.jobServiceAccount.create }}
---
# Least-privilege identity for run Job pods (and the migrate Job): bound to
# NO Role, token never mounted. Annotate for IRSA / workload identity if Job
# pods reach the artifact store that way.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dbtrunner.jobServiceAccountName" . }}
  namespace: {{ .Values.runner.namespace }}
  labels:
    {{- include "dbtrunner.labels" . | nindent 4 }}
  {{- with .Values.runner.jobServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}

{{- if eq .Values.runner.mode "k8s_job" }}
---
# Narrow RBAC for the API pod in the runner namespace only:
#  - Jobs: create (suspended), patch (release), get/list/watch, delete (only
#    after verifying labels + UID in app code).
#  - Pods / logs: read the result-reference marker.
#  - Secrets: create ONLY. Per-run Secrets carry an ownerReference to their
#    Job and are garbage-collected with it, so no get/list/delete is needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dbtrunner.fullname" . }}-job-runner
  namespace: {{ .Values.runner.namespace }}
  labels:
    {{- include "dbtrunner.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  {{- with .Values.runner.rbac.secretGetResourceNames }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      {{- toYaml . | nindent 6 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dbtrunner.fullname" . }}-job-runner
  namespace: {{ .Values.runner.namespace }}
  labels:
    {{- include "dbtrunner.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dbtrunner.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "dbtrunner.fullname" . }}-job-runner
  apiGroup: rbac.authorization.k8s.io
{{- end }}

{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "dbtrunner.fullname" . }}
  labels:
    {{- include "dbtrunner.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "dbtrunner.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dbtrunner.fullname" . }}
  labels:
    {{- include "dbtrunner.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "dbtrunner.selectorLabels" . | nindent 6 }}
{{- end }}

{{- if .Values.migrations.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dbtrunner.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "dbtrunner.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dbtrunner.name" . }}-migrate
        app.kubernetes.io/instance: {{ include "dbtrunner.fullname" . }}
        job: migrate
    spec:
      restartPolicy: Never
      # Pre-install hook: runs before this release's ServiceAccounts exist, so
      # it uses the namespace default SA — with no API token mounted (it needs
      # no k8s API access at all).
      automountServiceAccountToken: false
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "dbtrunner.fullname" . }}-config
          env:
            {{- include "dbtrunner.dbEnv" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
{{- end }}
