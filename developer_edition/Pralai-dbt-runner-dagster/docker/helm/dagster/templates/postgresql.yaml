{{- /*
DG-004: the optional IN-CLUSTER Postgres for Dagster's metadata (postgresql.enabled=true). One StatefulSet replica with a PersistentVolumeClaim,
a ClusterIP Service named <fullname>-postgresql (the host the Dagster pods are given), and — with networkPolicy.enabled — a policy that lets ONLY
the three Dagster components reach it. It is meant for small / evaluation installs: it is a single replica with no backups or failover, so
production should keep postgresql.enabled=false and use a managed database (RDS...) through postgresql.external.
The password comes from the SAME Secret the external database uses (postgresql.external.passwordSecretRef, which must exist already): the
database is initialised with it on first start; the Dagster pods read it from there too.
*/ -}}
{{- if .Values.postgresql.enabled }}
{{- $pg := .Values.postgresql }}
{{- $in := $pg.internal }}
{{- $name := printf "%s-postgresql" (include "dagster-dbt-runner.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "dagster-dbt-runner.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "dagster-dbt-runner.selectorLabels" (dict "Chart" .Chart "Values" .Values "Release" .Release "component" "postgresql") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "dagster-dbt-runner.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "dagster-dbt-runner.selectorLabels" (dict "Chart" .Chart "Values" .Values "Release" .Release "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dagster-dbt-runner.selectorLabels" (dict "Chart" .Chart "Values" .Values "Release" .Release "component" "postgresql") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # the postgres user of the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgresql
          image: "{{ $in.image.repository }}:{{ $in.image.tag }}"
          imagePullPolicy: {{ $in.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ $pg.external.user | default "dagster" | quote }}
            - name: POSTGRES_DB
              value: {{ $pg.external.database | default "dagster" | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pg.external.passwordSecretRef.name }}
                  key: {{ $pg.external.passwordSecretRef.key }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata       # a subdirectory: the volume root holds lost+found on some storage classes
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- with $in.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "dagster-dbt-runner.labels" . | nindent 10 }}
          app.kubernetes.io/component: postgresql
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $in.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $in.persistence.size }}
{{- if .Values.networkPolicy.enabled }}
---
# Default-deny (the chart-wide policy selects this pod too) plus exactly one allowance: Postgres from the three Dagster components.
# No egress at all: the database needs to reach nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "dagster-dbt-runner.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  podSelector:
    matchLabels:
      {{- include "dagster-dbt-runner.selectorLabels" (dict "Chart" .Chart "Values" .Values "Release" .Release "component" "postgresql") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range $c := list "webserver" "daemon" "code-server" }}
        - podSelector:
            matchLabels:
              {{- include "dagster-dbt-runner.selectorLabels" (dict "Chart" $.Chart "Values" $.Values "Release" $.Release "component" $c) | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
  egress: []
{{- end }}
{{- end }}
