{{- include "dagster-dbt-runner.validateStorage" . -}}
{{- if .Values.persistence.enabled }}
{{- if eq .Values.persistence.computeLogs.mode "rwx" }}
---
# Shared by the code server (writes step logs) and the webserver (shows them) ONLY, so it must be ReadWriteMany (DG-019).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dagster-dbt-runner.fullname" . }}-compute-logs
  labels:
    {{- include "dagster-dbt-runner.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.persistence.computeLogs.size }}
  storageClassName: {{ .Values.persistence.computeLogs.storageClass | quote }}
{{- end }}

---
# Mounted by the code server ALONE (single pod, strategy Recreate), so ReadWriteOnce is safe (DG-019).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dagster-dbt-runner.fullname" . }}-artifacts
  labels:
    {{- include "dagster-dbt-runner.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.artifacts.size }}
  {{- if .Values.persistence.artifacts.storageClass }}
  storageClassName: {{ .Values.persistence.artifacts.storageClass | quote }}
  {{- end }}
{{- end }}
