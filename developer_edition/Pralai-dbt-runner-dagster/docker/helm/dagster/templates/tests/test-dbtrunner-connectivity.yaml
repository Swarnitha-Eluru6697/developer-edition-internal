# `helm test <release>`: proves Dagster can actually reach the dbt Runner it was configured for (DG-005).
# Checks the Service name/port (GET /healthz) AND Dagster's scoped scheduler identity plus network policy (GET the
# internal route the schedule sensor uses, with a freshly minted dbt.projects.read token). A wrong name, port, key
# or an unlabelled namespace fails here
# instead of showing up later as failed sensor ticks.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "dagster-dbt-runner.fullname" . }}-test-dbtrunner
  labels:
    {{- include "dagster-dbt-runner.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "dagster-dbt-runner.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "dagster-dbt-runner.serviceAccountName" . }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 10002
    runAsGroup: 10002
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: dbtrunner-connectivity
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      env:
        - name: DBT_RUNNER_BASE_URL
          value: {{ include "dagster-dbt-runner.dbtRunnerUrl" . | quote }}
        - name: SCHEDULER_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.dbtRunner.schedulerJwtSecretRef.name }}
              key: {{ .Values.dbtRunner.schedulerJwtSecretRef.key }}
        - name: ORG_ID
          value: {{ required "tenant.orgId is required" .Values.tenant.orgId | quote }}
      command:
        - python
        - -c
        - |
          import base64, hashlib, hmac, json, os, sys, time, urllib.error, urllib.request, uuid
          base = os.environ["DBT_RUNNER_BASE_URL"].rstrip("/")
          def token(scope):   # the same token Dagster mints (resources/dbt_runner_client.py)
              b = lambda d: base64.urlsafe_b64encode(d).rstrip(b"=")
              now = int(time.time())
              head = b(json.dumps({"alg": "HS256", "typ": "JWT"}).encode())
              body = b(json.dumps({"iss": "dagster", "sub": "dagster", "aud": "dbtrunner", "scope": scope,
                                   "org_id": os.environ["ORG_ID"], "jti": uuid.uuid4().hex, "iat": now, "exp": now + 60}).encode())
              sig = b(hmac.new(os.environ["SCHEDULER_JWT_SECRET"].encode(), head + b"." + body, hashlib.sha256).digest())
              return (head + b"." + body + b"." + sig).decode()
          def get(path, headers=None):
              req = urllib.request.Request(base + path, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.status
              except urllib.error.HTTPError as e:
                  return e.code
              except Exception as e:
                  sys.exit(f"FAIL: cannot reach {base}{path}: {e} (wrong Service name/port, or the runner's NetworkPolicy does not admit this namespace: label it inaiera.com/data-plane=true)")
          s = get("/healthz")
          if s != 200:
              sys.exit(f"FAIL: {base}/healthz returned HTTP {s}")
          s = get("/api/v1/internal/projects/scheduled", {"X-Internal-Service-Token": token("dbt.projects.read")})
          if s != 200:
              sys.exit(f"FAIL: {base}/api/v1/internal/projects/scheduled returned HTTP {s} (401 = SCHEDULER_JWT_SECRET or ORG_ID does not match the runner's; 403 = wrong scope or org)")
          print(f"OK: dbt Runner reachable at {base}, scoped scheduler token accepted")
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
