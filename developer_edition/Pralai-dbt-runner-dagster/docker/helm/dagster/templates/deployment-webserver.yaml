{{- $component := "webserver" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dagster-dbt-runner.fullname" . }}-webserver
  labels:
    {{- include "dagster-dbt-runner.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ .Values.webserver.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dagster-dbt-runner.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dagster-dbt-runner.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      serviceAccountName: {{ include "dagster-dbt-runner.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: webserver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - dagster-webserver
            - --host
            - "0.0.0.0"
            - --port
            - "{{ .Values.webserver.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.webserver.port }}
              protocol: TCP
          env:
            {{- include "dagster-dbt-runner.commonEnv" . | nindent 12 }}
            {{- include "dagster-dbt-runner.s3LogsEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "dagster-dbt-runner.commonVolumeMounts" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.webserver.resources | nindent 12 }}
      volumes:
        {{- include "dagster-dbt-runner.volumes" (dict "ctx" . "sharesLogs" true "ownsArtifacts" false) | nindent 8 }}
      {{- with .Values.webserver.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webserver.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webserver.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
