{{- $component := "code-server" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dagster-dbt-runner.fullname" . }}-code
  labels:
    {{- include "dagster-dbt-runner.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ .Values.codeServer.replicaCount }}
  {{- if .Values.persistence.enabled }}
  # The artifacts volume is ReadWriteOnce: the old pod must release it before its replacement starts (DG-019).
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dagster-dbt-runner.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dagster-dbt-runner.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      serviceAccountName: {{ include "dagster-dbt-runner.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: code-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - dagster
            - api
            - grpc
            - --module-name
            - pralai_dbt_runner_dags.definitions
            - --attribute
            - defs
            - --host
            - "0.0.0.0"
            - --port
            - "4000"
          ports:
            - name: grpc
              containerPort: 4000
              protocol: TCP
          env:
            {{- include "dagster-dbt-runner.commonEnv" . | nindent 12 }}
            {{- include "dagster-dbt-runner.runnerEnv" . | nindent 12 }}
            {{- include "dagster-dbt-runner.s3LogsEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "dagster-dbt-runner.commonVolumeMounts" . | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - dagster
                - api
                - grpc-health-check
                - -p
                - "4000"
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - dagster
                - api
                - grpc-health-check
                - -p
                - "4000"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.codeServer.resources | nindent 12 }}
      volumes:
        {{- include "dagster-dbt-runner.volumes" (dict "ctx" . "sharesLogs" true "ownsArtifacts" true) | nindent 8 }}
      {{- with .Values.codeServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.codeServer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.codeServer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
