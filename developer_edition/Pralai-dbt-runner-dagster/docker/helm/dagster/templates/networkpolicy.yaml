{{- if .Values.networkPolicy.enabled }}
{{- /*
DG-002 / DG-020: every Dagster pod is DEFAULT-DENY in both directions; each component is then given exactly what it needs.

  webserver  in : the declared auth layer's namespace only (none at all while the ingress is disabled)
             out: DNS, Postgres, the code server's gRPC
  daemon     in : nothing
             out: DNS, Postgres, the code server's gRPC
  code       in : gRPC from the webserver and the daemon only
             out: DNS, Postgres, the dbt Runner (no Git: the git sensor asks the Runner for each project's commit, DG-009)

The dbt Runner credential is mounted into the code server only (DG-003); the policies make the same split on the network.
*/ -}}
{{- $name := include "dagster-dbt-runner.name" . }}
{{- $inst := .Release.Name }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dagster-dbt-runner.fullname" . }}-default-deny
  labels:
    {{- include "dagster-dbt-runner.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $inst }}
  policyTypes:
    - Ingress
    - Egress
---
# DG-002: the Dagster webserver / GraphQL API is an admin surface with no authentication of its own.
# Nothing may reach the pod except the declared auth layer (gateway / ingress controller namespace);
# with the ingress disabled it takes no inbound traffic at all (use kubectl port-forward).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dagster-dbt-runner.fullname" . }}-webserver
  labels:
    {{- include "dagster-dbt-runner.labels" . | nindent 4 }}
    app.kubernetes.io/component: webserver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $inst }}
      app.kubernetes.io/component: webserver
  policyTypes:
    - Ingress
    - Egress
  {{- if .Values.webserver.ingress.enabled }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "webserver.ingress.auth.fromNamespace is required when the ingress is enabled" .Values.webserver.ingress.auth.fromNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.webserver.port }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    {{- include "dagster-dbt-runner.egressDns" . | nindent 4 }}
    {{- include "dagster-dbt-runner.egressPostgres" . | nindent 4 }}
    {{- include "dagster-dbt-runner.egressCode" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dagster-dbt-runner.fullname" . }}-daemon
  labels:
    {{- include "dagster-dbt-runner.labels" . | nindent 4 }}
    app.kubernetes.io/component: daemon
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $inst }}
      app.kubernetes.io/component: daemon
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    {{- include "dagster-dbt-runner.egressDns" . | nindent 4 }}
    {{- include "dagster-dbt-runner.egressPostgres" . | nindent 4 }}
    {{- include "dagster-dbt-runner.egressCode" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dagster-dbt-runner.fullname" . }}-code
  labels:
    {{- include "dagster-dbt-runner.labels" . | nindent 4 }}
    app.kubernetes.io/component: code-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $inst }}
      app.kubernetes.io/component: code-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
              app.kubernetes.io/instance: {{ $inst }}
              app.kubernetes.io/component: webserver
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
              app.kubernetes.io/instance: {{ $inst }}
              app.kubernetes.io/component: daemon
      ports:
        - protocol: TCP
          port: 4000
  egress:
    {{- include "dagster-dbt-runner.egressDns" . | nindent 4 }}
    {{- include "dagster-dbt-runner.egressPostgres" . | nindent 4 }}
    # the dbt Runner (Service port {{ .Values.dbtRunner.servicePort }} -> the runner pod's port)
    {{- include "dagster-dbt-runner.egressRunner" . | nindent 4 }}
---
# The `helm test` pod runs under the same default-deny and may reach only DNS and the dbt Runner, by the SAME rule as the
# code server: a passing `helm test` proves that rule works on this cluster's CNI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dagster-dbt-runner.fullname" . }}-test
  labels:
    {{- include "dagster-dbt-runner.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $inst }}
      app.kubernetes.io/component: test
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    {{- include "dagster-dbt-runner.egressDns" . | nindent 4 }}
    {{- include "dagster-dbt-runner.egressRunner" . | nindent 4 }}
{{- end }}
