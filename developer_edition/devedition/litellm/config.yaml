# Developer Edition model gateway (LiteLLM) for the Workspace codegen agent.
# Same model names Workspace asks for as the product's own config
# (InaiEra_workspace_backend/docker/litellm/config.yaml), but mapped to public Ollama
# models: the product's default "inai-codegen" is a custom model that is not on the
# public Ollama library. Ollama runs on the Mac (brew services start ollama); pull with
#   ollama pull qwen3-coder:30b && ollama pull qwen3:8b
model_list:
  - model_name: codegen-generation
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://host.docker.internal:11434
      keep_alive: 30m
  - model_name: codegen-generation-alt
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://host.docker.internal:11434
      keep_alive: 30m
  - model_name: codegen-utility
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://host.docker.internal:11434
      keep_alive: 30m
      reasoning_effort: none

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  request_timeout: 600
