# Developer Edition Prometheus: feeds DataConnect's Dashboard / Monitoring metrics
# (records read/written, consumer lag, task failures). DataConnect queries it through
# DATACONNECT_PROMETHEUS_URL; it never scrapes the workers itself.
#
# Based on InaiEra_DataConnect_Backend/infra/prometheus/prometheus.yml, but Developer
# Edition runs every connector on the one shared Kafka Connect worker, so only that
# worker is scraped (the per-pool workers do not exist here).
global:
  scrape_interval: 15s          # keep equal to DATACONNECT_PROMETHEUS_SCRAPE_INTERVAL_SECONDS
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: dataconnect
    metrics_path: /metrics
    static_configs:
      - targets: ["dataconnect-api:8000"]

  - job_name: kafka-connect
    metrics_path: /metrics
    static_configs:
      - targets: ["kafka-connect:9404"]
        labels: {pool: shared}
