# LiteLLM model gateway for local development — the `model-gateway` service in
# docker/docker-compose.yml. It is the codegen agent's only door to inference
# (app/codegen_agent/model_client.py -> CODEGEN_GATEWAY_URL).
#
# It fronts Ollama running natively on the host (Docker on macOS can't use the
# GPU, so the models stay outside the container) with the *logical* model names
# the workspace uses — codegen-generation / codegen-generation-alt /
# codegen-utility — so swapping a checkpoint is a change here, never an
# application change. In a real data plane this is the in-cluster gateway
# (vLLM/LiteLLM) at codegen.gatewayUrl in the Helm chart.
#
# Host prerequisites (once):
#   ollama pull qwen3-coder:30b
#   ollama pull qwen3:8b
#   ollama serve            # or run the Ollama app
#
# Uses the `ollama_chat/` provider rather than `openai/`: it maps the OpenAI
# request onto Ollama's native /api/chat, so `response_format: json_object`
# becomes Ollama's `format: json` (the agent's plan stage relies on JSON mode).

model_list:
  # Default generator — inai-codegen, the team's fine-tuned Qwen2.5-Coder-1.5B
  # (merged weights from the 10-30-2026 export, converted to GGUF and registered
  # in Ollama with ~/.inaiera-local/models/inai-codegen/Modelfile). Switched
  # 2026-10-30; the previous default was ollama_chat/qwen3-coder:30b, which is
  # still installed and is offered as codegen-generation-alt below.
  - model_name: codegen-generation
    litellm_params:
      model: ollama_chat/inai-codegen
      api_base: http://host.docker.internal:11434
      keep_alive: 30m

  # User-selectable second generator: the previous default, Qwen3-Coder-30B-A3B
  # (MoE, ~3.3B active per token), kept as the fallback if inai-codegen does not
  # perform well. Pick it in the model picker, or point codegen-generation back
  # at it to make it the default again.
  - model_name: codegen-generation-alt
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://host.docker.internal:11434
      keep_alive: 30m

  # Cheap stages: intent classification, error normalisation, critic.
  - model_name: codegen-utility
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://host.docker.internal:11434
      keep_alive: 30m
      # qwen3:8b is a hybrid-thinking model; left on, it spends the output budget
      # on reasoning and can return empty content for short structured calls.
      # A non-{low,medium,high} reasoning_effort maps to Ollama's `think: false`.
      reasoning_effort: none

general_settings:
  # Local dev only. Must match CODEGEN_GATEWAY_API_KEY in docker-compose.yml.
  master_key: sk-local-dev-key

litellm_settings:
  drop_params: true
  # A 30B generation of up to 4096 tokens on Metal can run long; the service
  # applies its own CODEGEN_REQUEST_TIMEOUT_SECONDS on top.
  request_timeout: 600
