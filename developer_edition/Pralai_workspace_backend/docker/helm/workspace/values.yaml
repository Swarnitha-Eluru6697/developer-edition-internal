# Default values for the Workspace chart.
#
# These are overridden per customer org by Infra & Product Release Mgmt at
# provisioning time. Tenant-specific values (org_id, subdomain, cloud) come
# from the parent inaiera-data-plane chart's tenant context.

# -----------------------------------------------------------------------------
# Identity — set per customer org by the parent chart
# -----------------------------------------------------------------------------
tenant:
  orgId: "REPLACE_ME"             # e.g. "acme-corp"
  # Where this data plane lives. Used for telemetry tagging & log enrichment.
  cloud: "aws"                    # aws | azure | gcp
  region: "us-east-1"

# -----------------------------------------------------------------------------
# Image
# -----------------------------------------------------------------------------
image:
  repository: registry.inaiera.com/products/workspace
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: inaiera-registry

# -----------------------------------------------------------------------------
# Scaling
# -----------------------------------------------------------------------------
replicas: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# -----------------------------------------------------------------------------
# Networking & ingress
# -----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  # Per-org subdomain pattern. Parent chart fills {{ tenant.orgId }}.
  host: "{{ .Values.tenant.orgId }}.app.workspace.inaiera.com"
  tls:
    enabled: true
    secretName: "workspace-{{ .Values.tenant.orgId }}-tls"
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # WebSockets
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"

# -----------------------------------------------------------------------------
# Gateway trust contract (W-001)
# -----------------------------------------------------------------------------
# Workspace does not validate user tokens itself. The data-plane gateway (Envoy)
# checks the caller's token, strips any client-supplied x-user-* headers, injects
# its own, and adds the shared secret as X-Inaiera-Gateway-Secret. Workspace
# trusts those identity headers ONLY when TRUST_ENVOY_HEADERS is "true" AND the
# secret matches (app/core/deps.py). Without this contract the pods pass their
# health checks yet answer every protected API call with 401, so the chart
# declares it and refuses to render (values.schema.json) when it is incomplete.
#
# The Ingress / ingress controller in front of Workspace must be that gateway,
# or route through it; direct access to the pod or Service carries no secret and
# is refused with 401 by the app. networkPolicy.ingressControllerNamespace below
# is the namespace allowed to reach the pods — set it to the gateway's.
gateway:
  # trusted-envoy: identity headers from the gateway, proven by the shared secret.
  # The only mode the application implements.
  mode: "trusted-envoy"
  # Secret holding the shared value. The gateway must inject the SAME value as
  # X-Inaiera-Gateway-Secret (its ENVOY_INTERNAL_SECRET). It is mounted as
  # ENVOY_INTERNAL_SECRET on the API and worker pods — never put in the ConfigMap.
  internalSecretRef:
    name: "workspace-gateway-secret"
    key: "secret"

# -----------------------------------------------------------------------------
# Control plane handoff — JWKS for JWT validation
# -----------------------------------------------------------------------------
controlPlane:
  jwksUrl: "https://www.app.inaiera.com/.well-known/jwks.json"
  issuer: "https://www.app.inaiera.com"
  audience: "workspace.inaiera"
  # Where the SPA sends a user to log in again (served at /config.json, W-006). Empty = "<issuer>/login", so a staging or private-cloud
  # control plane only has to set `issuer`. An absolute http(s) URL when set.
  loginUrl: ""
  # CORS origin for the Root Platform App, in case it embeds the workspace.
  corsOrigins:
    - "https://www.app.inaiera.com"
    - "https://app.inaiera.com"

# -----------------------------------------------------------------------------
# Postgres (data plane metadata DB — pg_lake or a dedicated instance)
# Secret refs only; the actual password lives in the cloud secrets manager.
# -----------------------------------------------------------------------------
database:
  host: "postgres.dp-shared.svc.cluster.local"
  port: 5432
  name: "workspace"
  user: "workspace"
  # Reference to a k8s Secret created out-of-band by the provisioning process,
  # which itself sourced the value from the cloud secrets manager
  # (AWS Secrets Manager / Azure Key Vault / GCP Secret Manager).
  passwordSecretRef:
    name: "workspace-db-credentials"
    key: "password"
  sslmode: "require"

# -----------------------------------------------------------------------------
# Secrets vault (WS-SEC-002) — where DB-connection and Git credentials are
# stored; Workspace rows hold only references. Must be the customer cloud's
# secret manager: values.schema.json rejects anything else (the pod-local
# "local" store is dev-only and the app refuses to start with it in prod).
# Access is via the pod's workload identity (IRSA / Azure Workload Identity /
# GKE Workload Identity) bound to serviceAccount — no static cloud keys.
# -----------------------------------------------------------------------------
secrets:
  backend: "aws_secrets_manager"   # aws_secrets_manager | azure_key_vault | gcp_secret_manager
  pathPrefix: "inaiera/workspace"
  azureVaultUrl: ""                # required for azure_key_vault, e.g. https://my-vault.vault.azure.net
  gcpProjectId: ""                 # required for gcp_secret_manager

# -----------------------------------------------------------------------------
# Redis (WebSocket pub/sub fan-out)
# -----------------------------------------------------------------------------
redis:
  url: "redis://redis.dp-shared.svc.cluster.local:6379/2"

# -----------------------------------------------------------------------------
# Blob storage — backs the per-user "personal database"
# -----------------------------------------------------------------------------
storage:
  # s3 (AWS), azure_blob, or gcs — set by parent based on tenant.cloud
  backend: "s3"
  bucket: "inaiera-{{ .Values.tenant.orgId }}-workspace"
  # Optional. For S3-compatible (e.g. MinIO in dev) only.
  endpointUrl: ""
  region: "{{ .Values.tenant.region }}"
  # The service uses IRSA / Workload Identity / GCP WIF — no static keys.

# -----------------------------------------------------------------------------
# Cross-product endpoints inside the data plane
# -----------------------------------------------------------------------------
lakehouse:
  queryUrl: "http://data-lakehouse-query.dp-shared.svc.cluster.local:8080"

# -----------------------------------------------------------------------------
# Cross-service integration contract (WS-CFG-004)
#
# dbtRunner / flinkSqlRunner / dq / ucs each follow the same shape:
#   enabled: true | false
#   url: <in-cluster service URL>
#   internalTokenSecretRef: { name, key }   # k8s Secret ref, never a raw token
#
# values.schema.json (next to this file) enforces that url + internalTokenSecretRef
# are both set, non-empty, whenever an integration's `enabled` is true — `helm
# lint` / `helm template` / `helm install` all fail closed if one is misconfigured,
# instead of the app silently disabling that integration at runtime (WS-CFG-004's
# impact). Bump integrationsContractVersion below on any incompatible shape change.
# -----------------------------------------------------------------------------
integrationsContractVersion: 1

# Namespace the sibling dbt / FlinkSQL / DQ charts are installed in. The
# integration URLs below are templates (rendered with `tpl`), so they track
# both this and tenant.orgId.
integrationsNamespace: "dp-shared"

# Dagster (optional). With a GraphQL URL, "Run now" for a dbt / SQL / Python job launches the project's Dagster job, so the dependency
# rule enforced in Dagster (a job runs only when the jobs above it have a recent success) applies to a run started by hand too.
# Run now then needs Dagster to be up. Leave empty for a deployment without Dagster (Run now calls the runner directly). The Dagster
# webserver's namespace must be reachable: add it to networkPolicy.egressNamespaces.
dagster:
  graphqlUrl: ""            # e.g. "http://dagster-webserver.dagster.svc.cluster.local:3000/graphql"

# Alerts: failures of the jobs, raised by rules and posted to Slack / Microsoft Teams channels (webhooks). The sweep that raises them runs
# in the worker pods every sweepIntervalSeconds. Posting to a webhook is outbound HTTPS to the provider: set networkPolicy.allowPublicHttps
# (or allow the provider's addresses in networkPolicy.egressCIDRs). webhookExtraHosts: hosts a webhook may use besides Slack's and
# Teams' own (a corporate relay), as plain names or ".suffix".
#
# Acknowledge / Resolve BUTTONS in the messages: set publicUrl (the address people reading Slack / Teams can open, e.g. the Workspace's
# public hostname) AND actionSecretRef (a Secret key with a long random value that signs the links). Both or no buttons. The path
# /api/v1/alerts/actions/* must be let through the gateway WITHOUT a login: the signed link is the credential (one alert, one action,
# one channel, expiring), and a link only opens a confirmation page: nothing changes until the button on that page is pressed.
alerts:
  sweepEnabled: true
  sweepIntervalSeconds: 60
  webhookExtraHosts: []
  statusUpdates: true       # post "acknowledged / resolved / cleared automatically" follow-ups to the channels that got the alert
  publicUrl: ""             # e.g. "https://workspace.acme.example"
  actionSecretRef: null     # e.g. { name: workspace-alerts, key: action-secret }

dbtRunner:
  enabled: true
  # The dbt runner chart's Service: dbt-runner-<org>, port 80.
  url: "http://dbt-runner-{{ include \"workspace.orgSlug\" . }}.{{ .Values.integrationsNamespace }}.svc.cluster.local"
  # Narrow-scope token for the deploy/validate calls from codegen — see
  # app/core/config.py:dbtrunner_internal_token.
  internalTokenSecretRef:
    name: "workspace-dbtrunner-token"
    key: "internal-token"
  # Signs the short-lived delegated JWT Workspace presents to the runner on a user's behalf (aud
  # "dbtrunner", one scope, sub = the user, act = workspace) INSTEAD of forwarding the user's own
  # credential (X-001). Must hold the same value as the runner's DELEGATION_JWT_SECRET, and differ from
  # the internal token above. Required when dbtRunner.enabled; with none, dbt calls are refused (503).
  delegationJwtSecretRef:
    name: "workspace-dbtrunner-delegation-jwt"
    key: "secret"

flinkSqlRunner:
  enabled: true
  # The FlinkSQL runner chart's Service: flinksql-runner-<org>, port 80.
  url: "http://flinksql-runner-{{ include \"workspace.orgSlug\" . }}.{{ .Values.integrationsNamespace }}.svc.cluster.local"
  # Flink Web UI base URL as reached from the user's BROWSER (an ingress host),
  # not the in-cluster JobManager address. Empty hides the "View logs" action.
  uiUrl: ""
  # The runner's /validate endpoint takes a service token, never a user JWT.
  # Used by codegen and by the FlinkSQL editor's Validate action.
  internalTokenSecretRef:
    name: "workspace-flinksql-token"
    key: "internal-token"
  # Same for the FlinkSQL Runner (aud "flinksql-runner"); equals the runner's DELEGATION_JWT_SECRET (X-001).
  delegationJwtSecretRef:
    name: "workspace-flinksql-delegation-jwt"
    key: "secret"

dq:
  enabled: true
  # The DQ chart's Service: data-quality-<org>, port 80.
  url: "http://data-quality-{{ .Values.tenant.orgId }}.{{ .Values.integrationsNamespace }}.svc.cluster.local"
  # Narrow-scope token for /render/validate/rule — see
  # app/core/config.py:dq_internal_token. Attached server-side by dq_proxy,
  # never forwarded from the browser.
  internalTokenSecretRef:
    name: "workspace-dq-token"
    key: "internal-token"
  # Signs the scoped JWT DQ's inbound validate route requires (aud
  # "dataquality", scope "dq.rules.validate"). Must hold the same value as
  # DQ's INBOUND_SERVICE_JWT_SECRET. Required when dq.enabled — outside dev the
  # raw internal token above is never sent.
  serviceJwtSecretRef:
    name: "workspace-dq-service-jwt"
    key: "secret"
  # X-001: signs the short-lived DELEGATED token Workspace presents to DQ on a user's behalf (aud "dataquality", the DQ
  # scope(s) of the call, act = workspace) instead of forwarding the user's own credential, which DQ no longer accepts.
  # Must hold the same value as DQ's DELEGATION_JWT_SECRET. Required when dq.enabled; a Secret of its own (it must differ
  # from serviceJwtSecretRef and every runner delegation key).
  delegationJwtSecretRef:
    name: "workspace-dq-delegation-jwt"
    key: "secret"

# -----------------------------------------------------------------------------
# Governance profile (W-010)
# -----------------------------------------------------------------------------
# Catalog/UCS is the governance spine of the platform, so the chart's default is the profile that REQUIRES it:
#   production-governed     (default, the only profile supported for production) UCS must be enabled with its URL and gateway
#                           secret, and the data policy must be audit or enforce. The chart refuses to render otherwise, and the
#                           application refuses to start (outside dev) without a configured UCS, instead of running partially
#                           governed or failing closed on governed functions at runtime.
#   development-ungoverned  UCS may be absent. UNSUPPORTED FOR PRODUCTION: governed functions (connection use, catalog discovery,
#                           the dbt/Flink/DQ/Git policy gate) fail closed or are skipped. Requires acknowledgeUnsupportedForProduction:
#                           true; every resource is labelled inaiera.com/governance-profile and inaiera.com/supported-for-production.
governance:
  profile: "production-governed"
  acknowledgeUnsupportedForProduction: false

ucs:
  # Workspace calls UCS directly (app/services/ucs_client.py) for connection grants, catalog discovery and the resource/data policy
  # gate. `internalTokenSecretRef` must hold UCS's gateway secret (its ENVOY_INTERNAL_SECRET); it is mounted as UCS_GATEWAY_SECRET and
  # sent as X-Inaiera-Gateway-Secret. Set `url` to your UCS Service. Only the development-ungoverned profile may disable it.
  enabled: true
  url: "http://ucs-catalog.{{ .Values.integrationsNamespace }}.svc.cluster.local:8000"
  internalTokenSecretRef:
    name: "workspace-ucs-gateway-secret"
    key: "secret"

# -----------------------------------------------------------------------------
# Connection use (W-011)
# -----------------------------------------------------------------------------
# A connection is authorised in UCS by its persisted canonical resource (the UCS catalog it is linked to, else
# `inaiera_workspace.connection.<id>`), never by its name. May a connection's CREATOR use it without a UCS decision (the owner bypass)?
#   unset  decided by governance.profile: not allowed in production-governed (UCS decides for everyone), allowed in development-ungoverned
#   true / false  an explicit policy, whatever the profile. Every bypass is logged (connection_use_owner_bypass).
connections:
  ownerBypass: null

# -----------------------------------------------------------------------------
# Resource/data policy (X-006) — UCS as the policy gate for production actions
# -----------------------------------------------------------------------------
# Workspace RBAC is the coarse product gate; UCS governs the resource: every dbt / Flink / Data Quality / Git route names a product
# action (dbt.run, flink.deploy, dq.publish, git.repo.write, ...) and UCS is asked about it with the context (environment,
# classification, resource owner, target object). docs/DATA_POLICY.md lists the actions and the objects governance must grant.
#   off      no UCS call.
#   audit    ask UCS, record the decision, never block (the default: a would-be denial is logged and audited).
#   enforce  a UCS denial is a 403; UCS unreachable or not configured is a 503 (fail closed). Requires ucs.enabled.
# `enforcedActions` narrows enforce to some actions (empty = all); the rest stay in audit, so a rollout can go action by action.
dataPolicy:
  mode: "audit"
  enforcedActions: []
  # Catalog name of the pseudo objects (<catalog>.<kind>.<id>) used for resources UCS has no object for.
  catalog: "inaiera_workspace"

# -----------------------------------------------------------------------------
# Codegen agent — self-hosted SQL / dbt / FlinkSQL / Python authoring assistant.
# All inference goes through an in-perimeter OpenAI-compatible gateway
# (LiteLLM/vLLM); there is no external LLM provider and no provider API key.
# -----------------------------------------------------------------------------
codegen:
  # OpenAI-compatible gateway inside the data plane.
  gatewayUrl: "http://model-gateway.dataplane.svc:4000/v1"
  # The gateway and its models run inside this data plane, so the open file
  # is sent to the model (secrets redacted) without the external-egress
  # approval gate. Set false if gatewayUrl ever fronts an outside provider.
  gatewayInPerimeter: true
  # Logical model names (mapped to checkpoints at the gateway).
  modelGeneration: "codegen-generation"          # default generator (e.g. Qwen3-Coder-30B)
  modelGenerationAlt: "codegen-generation-alt"   # user-selectable second model
  modelUtility: "codegen-utility"                # cheap stages (intent, error-normalise, critic)
  maxAgentTurns: 6
  maxAttemptsPerStage: 3
  requestTimeoutSeconds: 120
  flinksqlEnabled: false   # flip on once Dataconnect topic catalog ships
  # Optional bearer token if the gateway enforces auth (in-cluster, NOT a
  # provider key). Omit for an unauthenticated in-cluster gateway.
  gatewayApiKeySecretRef: null
  #   name: "workspace-model-gateway-token"
  #   key: "token"
  # Optional: Kafka Schema Registry for grounding Python/Flink topic schemas.
  schemaRegistryUrl: ""
  # Optional basic-auth "user:pass" for the registry, from a Secret.
  schemaRegistryAuthSecretRef: null

# Notebook cells run only in JupyterHub-spawned kernels, never in Workspace
# pods. Per-kernel CPU/memory/network limits are set in the JupyterHub
# release — required values in NOTEBOOK_RUNTIME.md (WS-RUNTIME-012).
jupyterhub:
  # The Hub's base URL (not .../hub/api — the app adds the API paths).
  url: "http://jupyterhub.dp-shared.svc.cluster.local:8081"
  # Hub API token also stored in the secrets manager
  apiTokenSecretRef:
    name: "workspace-jupyterhub-token"
    key: "token"

# -----------------------------------------------------------------------------
# Telemetry — outbound-only push to the Support Portal Kafka ingest
# -----------------------------------------------------------------------------
telemetry:
  enabled: true
  endpoint: "https://telemetry-ingest.inaiera.com/v1/events"

# -----------------------------------------------------------------------------
# Probes
# -----------------------------------------------------------------------------
probes:
  # Gives a cold start (migration check, kernel image pull) time before
  # liveness applies, so slow boots aren't killed.
  startup:
    httpGet:
      path: /healthz
      port: 8080
    periodSeconds: 5
    failureThreshold: 24
  liveness:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5

# -----------------------------------------------------------------------------
# Pod security
# -----------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  # The image's own `workspace` user (docker/Dockerfile) — was 1000, which
  # matched nothing in the image.
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# -----------------------------------------------------------------------------
# Service account — used for cloud IAM via IRSA / Workload Identity
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: "workspace"
  # The app never calls the Kubernetes API. IRSA / Azure Workload Identity
  # inject their own projected token volume and GKE Workload Identity uses
  # the metadata server, so cloud IAM works without the default SA token.
  automountToken: false
  annotations: {}
    # AWS:    eks.amazonaws.com/role-arn: arn:aws:iam::123:role/workspace-{{ .Values.tenant.orgId }}
    # Azure:  azure.workload.identity/client-id: <client-id>
    # GCP:    iam.gke.io/gcp-service-account: workspace@{{project}}.iam.gserviceaccount.com

# -----------------------------------------------------------------------------
# Migrations (run as a Job before the deployment rolls)
# -----------------------------------------------------------------------------
migrations:
  enabled: true
  backoffLimit: 3

# -----------------------------------------------------------------------------
# Execution worker (WS-EXEC-005) — `python -m app.worker`, see worker.yaml.
# API pods only accept submissions; these pods run them.
# -----------------------------------------------------------------------------
worker:
  replicas: 2
  concurrency: 4          # executions per worker pod
  pollIntervalSeconds: 2
  leaseSeconds: 30        # the lease a worker holds on a running execution ROW (Postgres), extended every third of this
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

# -----------------------------------------------------------------------------
# Egress (WS-009). Application-level allowlists plus the NetworkPolicy below.
# -----------------------------------------------------------------------------
egress:
  gitAllowedHosts: ["github.com", "gitlab.com", "bitbucket.org", "dev.azure.com", "visualstudio.com"]
  gitlabHosts: []                    # self-hosted GitLab hosts (must also be in gitAllowedHosts)
  # Private networks registered database connections may reach — e.g. the
  # customer VPC's DB subnets. Private addresses are denied unless listed.
  connectionAllowedNetworks: []
  connectionAllowedHosts: []
  connectionAllowPublic: true

# -----------------------------------------------------------------------------
# NetworkPolicy (WS-009): default-deny for all Workspace pods, then only:
#   ingress  — API pods, from the ingress controller's namespace
#   egress   — DNS; the namespaces of in-cluster dependencies (Postgres,
#              Redis, runners, DQ, UCS, JupyterHub, model gateway); the
#              CIDRs below (DB networks, cloud endpoints); and TCP 443 to
#              public addresses (cloud secret manager / object storage /
#              Git hosts — which hosts is enforced in the app, NetworkPolicy
#              can't match DNS names).
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# SQL jobs on a Workspace connection (Jobs → SQL, "run on a connection"). The dbt Runner holds no connection credentials: it sends a
# job's statements to POST /api/v1/internal/jobs/sql with a one-run token, and this service runs them on the connection as the user
# who registered the job. Off by default; turning it on needs the runner's `jobs.workspace` too (same secret value), and the
# Workspace's ingress NetworkPolicy to admit the runner's pods (`runnerNamespace`).
# -----------------------------------------------------------------------------
sqlJobs:
  enabled: false
  # Verifies the token the runner signs (aud "workspace", scope "sql.jobs.run"). Must hold the same value as the dbt Runner's
  # WORKSPACE_JOB_JWT_SECRET and be a Secret of its own: it must differ from every other secret of this release.
  runnerJobJwtSecretRef:
    name: "workspace-runner-job-jwt"
    key: "secret"
  # The namespace the dbt Runner (its API and its run Jobs) runs in; its pods may reach this service's port 8080.
  runnerNamespace: "dataplane"

networkPolicy:
  enabled: true
  ingressControllerNamespace: "ingress-nginx"
  dnsNamespace: "kube-system"
  # Namespaces whose pods Workspace may reach (any port).
  egressNamespaces: ["dp-shared"]
  # Extra CIDRs (e.g. customer DB subnets — usually the same as
  # egress.connectionAllowedNetworks), any port.
  egressCIDRs: []
  # Public HTTPS (443) everywhere except private/link-local ranges.
  allowPublicHttps: true
