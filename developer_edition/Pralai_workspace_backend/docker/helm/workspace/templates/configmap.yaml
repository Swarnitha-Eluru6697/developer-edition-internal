apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "workspace.fullname" . }}-config
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
data:
  # Identity
  # Must be one of the Settings.environment Literal values ("dev", "staging",
  # "prod") — "production" is NOT one of them and fails Settings validation
  # at startup. This chart deploys the production data plane, hence "prod".
  ENVIRONMENT: "prod"
  ORG_ID: {{ .Values.tenant.orgId | quote }}

  # Gateway trust contract (W-001) — see values.yaml `gateway`. The app trusts
  # identity headers only when this is the literal string "true"
  # (app/core/deps.py), and only for requests that also carry the gateway
  # secret (ENVOY_INTERNAL_SECRET, from a secretKeyRef — see _helpers.tpl).
  {{- if ne (.Values.gateway.mode | default "") "trusted-envoy" }}
  {{- fail "gateway.mode must be \"trusted-envoy\": Workspace only accepts identity from a trusted gateway (see values.yaml `gateway`)" }}
  {{- end }}
  TRUST_ENVOY_HEADERS: "true"

  # Control plane auth
  CONTROL_PLANE_JWKS_URL: {{ .Values.controlPlane.jwksUrl | quote }}
  CONTROL_PLANE_ISSUER: {{ .Values.controlPlane.issuer | quote }}
  CONTROL_PLANE_AUDIENCE: {{ .Values.controlPlane.audience | quote }}
  {{- with .Values.controlPlane.loginUrl }}
  CONTROL_PLANE_LOGIN_URL: {{ . | quote }}
  {{- end }}
  CORS_ORIGINS: {{ join "," .Values.controlPlane.corsOrigins | quote }}

  {{- /*
  Database — no password here. DATABASE_PASSWORD comes from a secretKeyRef
  (deployment.yaml / the migrate Job) and the app merges it into this URL
  (Settings._merge_database_password). A $(DATABASE_PASSWORD) placeholder
  can't work: Kubernetes doesn't expand it in envFrom ConfigMap values.
  */}}
  DATABASE_URL: {{ include "workspace.databaseUrl" . | quote }}

  # Secrets vault (WS-SEC-002) — DB connection and Git credentials live here.
  # "local" is rejected by values.schema.json and by the app's startup guard.
  SECRETS_BACKEND: {{ .Values.secrets.backend | quote }}
  SECRETS_PATH_PREFIX: {{ .Values.secrets.pathPrefix | quote }}
  {{- if .Values.secrets.azureVaultUrl }}
  SECRETS_AZURE_VAULT_URL: {{ .Values.secrets.azureVaultUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.gcpProjectId }}
  SECRETS_GCP_PROJECT_ID: {{ .Values.secrets.gcpProjectId | quote }}
  {{- end }}

  # Redis
  REDIS_URL: {{ .Values.redis.url | quote }}

  # Storage
  STORAGE_BACKEND: {{ .Values.storage.backend | quote }}
  STORAGE_BUCKET: {{ tpl .Values.storage.bucket . | quote }}
  STORAGE_REGION: {{ tpl .Values.storage.region . | quote }}
  {{- if .Values.storage.endpointUrl }}
  STORAGE_ENDPOINT_URL: {{ .Values.storage.endpointUrl | quote }}
  {{- end }}

  # Cross-product endpoints
  LAKEHOUSE_QUERY_URL: {{ .Values.lakehouse.queryUrl | quote }}
  LAKEHOUSE_QUERY_TIMEOUT_SECONDS: {{ .Values.lakehouse.queryTimeoutSeconds | quote }}
  # Must be JUPYTERHUB_URL — Settings has no alias, so JUPYTERHUB_API_URL
  # (the old key here) was silently ignored, meaning JupyterHub was never
  # actually wired up and every notebook cell fell back to the unisolated
  # in-process kernel (WS-RUNTIME-012).
  # The Hub's BASE url — the app appends /hub/api/... and /user/... itself.
  # (A ".../hub/api" value here used to produce /hub/api/hub/api/... URLs.)
  JUPYTERHUB_URL: {{ .Values.jupyterhub.url | trimSuffix "/" | trimSuffix "/hub/api" | trimSuffix "/hub" | quote }}
  # The in-process kernel fallback must never run in this deployment — see
  # assert_local_kernel_safe_for_environment() (WS-RUNTIME-012). JupyterHub
  # above is the only Python execution path here.
  LOCAL_PYTHON_KERNEL_ENABLED: "false"

  # Cross-service integration contract (WS-CFG-004) — see values.schema.json
  # for the required-when-enabled validation on each of these.
  {{- if .Values.dbtRunner.enabled }}
  DBTRUNNER_URL: {{ tpl .Values.dbtRunner.url . | quote }}
  {{- end }}
  {{- if .Values.dagster.graphqlUrl }}
  DAGSTER_GRAPHQL_URL: {{ tpl .Values.dagster.graphqlUrl . | quote }}
  {{- end }}
  ALERTS_SWEEP_ENABLED: {{ .Values.alerts.sweepEnabled | quote }}
  ALERTS_SWEEP_INTERVAL_SECONDS: {{ .Values.alerts.sweepIntervalSeconds | quote }}
  ALERTS_STATUS_UPDATES: {{ .Values.alerts.statusUpdates | quote }}
  {{- if .Values.alerts.publicUrl }}
  ALERTS_PUBLIC_URL: {{ tpl .Values.alerts.publicUrl . | quote }}
  {{- end }}
  {{- if .Values.alerts.webhookExtraHosts }}
  ALERTS_WEBHOOK_EXTRA_HOSTS: {{ .Values.alerts.webhookExtraHosts | toJson | quote }}
  {{- end }}
  {{- if .Values.flinkSqlRunner.enabled }}
  FLINKSQL_RUNNER_URL: {{ tpl .Values.flinkSqlRunner.url . | quote }}
  FLINK_UI_URL: {{ .Values.flinkSqlRunner.uiUrl | quote }}
  {{- end }}
  {{- if .Values.dq.enabled }}
  DQ_SERVICE_URL: {{ tpl .Values.dq.url . | quote }}
  {{- end }}
  {{- if .Values.ucs.enabled }}
  UCS_SERVICE_URL: {{ tpl .Values.ucs.url . | quote }}
  {{- end }}

  # Governance profile (W-010) — see values.yaml `governance`.
  {{- $gov := .Values.governance | default dict }}
  {{- $profile := $gov.profile | default "production-governed" }}
  {{- if eq $profile "production-governed" }}
  {{- if not .Values.ucs.enabled }}
  {{- fail "governance.profile=production-governed requires ucs.enabled=true: Catalog/UCS is the governance spine. To run without it set governance.profile=development-ungoverned (unsupported for production)" }}
  {{- end }}
  {{- if eq ((.Values.dataPolicy | default dict).mode | default "audit") "off" }}
  {{- fail "governance.profile=production-governed does not allow dataPolicy.mode=off: use audit or enforce" }}
  {{- end }}
  {{- else if eq $profile "development-ungoverned" }}
  {{- if not $gov.acknowledgeUnsupportedForProduction }}
  {{- fail "governance.profile=development-ungoverned is UNSUPPORTED for production: set governance.acknowledgeUnsupportedForProduction=true to confirm this is not a production data plane" }}
  {{- end }}
  {{- else }}
  {{- fail (printf "governance.profile must be production-governed or development-ungoverned, got %q" $profile) }}
  {{- end }}
  GOVERNANCE_PROFILE: {{ $profile | quote }}
  {{- if kindIs "bool" (.Values.connections | default dict).ownerBypass }}
  CONNECTION_OWNER_BYPASS: {{ (.Values.connections).ownerBypass | quote }}
  {{- end }}

  # Resource/data policy (X-006). enforce fails closed, so it needs UCS (values.schema.json also refuses it without).
  {{- $dp := .Values.dataPolicy | default dict }}
  {{- if and (eq ($dp.mode | default "audit") "enforce") (not .Values.ucs.enabled) }}
  {{- fail "dataPolicy.mode=enforce requires ucs.enabled=true: enforcement fails closed, so without UCS every governed action would be refused" }}
  {{- end }}
  DATA_POLICY_MODE: {{ $dp.mode | default "audit" | quote }}
  DATA_POLICY_ENFORCED_ACTIONS: {{ $dp.enforcedActions | default list | toJson | quote }}
  DATA_POLICY_CATALOG: {{ $dp.catalog | default "inaiera_workspace" | quote }}

  # Execution worker (WS-EXEC-005) — see worker.yaml.
  EXECUTION_POLL_INTERVAL_SECONDS: {{ .Values.worker.pollIntervalSeconds | quote }}
  EXECUTION_LEASE_SECONDS: {{ .Values.worker.leaseSeconds | quote }}

  # Egress allowlists (WS-009 / WS-GIT-009) — JSON lists.
  GIT_ALLOWED_HOSTS: {{ .Values.egress.gitAllowedHosts | toJson | quote }}
  GIT_GITLAB_HOSTS: {{ .Values.egress.gitlabHosts | toJson | quote }}
  CONNECTION_ALLOWED_NETWORKS: {{ .Values.egress.connectionAllowedNetworks | toJson | quote }}
  CONNECTION_ALLOWED_HOSTS: {{ .Values.egress.connectionAllowedHosts | toJson | quote }}
  CONNECTION_ALLOW_PUBLIC: {{ .Values.egress.connectionAllowPublic | quote }}

  # Codegen agent — self-hosted model gateway; optional gateway token comes
  # from secretKeyRef in deployment.yaml.
  CODEGEN_GATEWAY_URL: {{ .Values.codegen.gatewayUrl | quote }}
  CODEGEN_GATEWAY_IN_PERIMETER: {{ .Values.codegen.gatewayInPerimeter | quote }}
  CODEGEN_MODEL_GENERATION: {{ .Values.codegen.modelGeneration | quote }}
  CODEGEN_MODEL_GENERATION_ALT: {{ .Values.codegen.modelGenerationAlt | quote }}
  CODEGEN_MODEL_UTILITY: {{ .Values.codegen.modelUtility | quote }}
  CODEGEN_GENERATION_MODELS: {{ list .Values.codegen.modelGeneration .Values.codegen.modelGenerationAlt | toJson | quote }}
  CODEGEN_MAX_AGENT_TURNS: {{ .Values.codegen.maxAgentTurns | quote }}
  CODEGEN_MAX_ATTEMPTS_PER_STAGE: {{ .Values.codegen.maxAttemptsPerStage | quote }}
  CODEGEN_REQUEST_TIMEOUT_SECONDS: {{ .Values.codegen.requestTimeoutSeconds | quote }}
  {{- if .Values.codegen.schemaRegistryUrl }}
  SCHEMA_REGISTRY_URL: {{ .Values.codegen.schemaRegistryUrl | quote }}
  {{- end }}
  CODEGEN_FLINKSQL_ENABLED: {{ .Values.codegen.flinksqlEnabled | quote }}

  # Telemetry
  TELEMETRY_ENABLED: {{ .Values.telemetry.enabled | quote }}
  TELEMETRY_ENDPOINT: {{ .Values.telemetry.endpoint | quote }}

  LOG_LEVEL: "INFO"
