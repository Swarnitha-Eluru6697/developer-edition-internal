name: API contract

# WS-FE-014: the committed openapi/workspace.json is the Workspace service's
# published REST contract — the SPA generates its TypeScript types from a copy
# of it (Pralai_workspace_frontend/openapi/workspace.v<version>.json). This
# job fails when the app's live schema (app.openapi()) no longer matches the
# committed file, so a route/schema change can't land without the contract
# being regenerated and reviewed alongside it.
#
# To update after an intentional API change:
#   python scripts/export_openapi.py openapi/workspace.json
# then copy the same file to the frontend repo's openapi/ snapshot and run
# `npm run codegen:api` there (see that repo's openapi/README.md).

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/export_openapi.py"
      - "openapi/**"
      - "pyproject.toml"
      - ".github/workflows/api-contract.yml"
  pull_request:
    paths:
      - "app/**"
      - "scripts/export_openapi.py"
      - "openapi/**"
      - "pyproject.toml"
      - ".github/workflows/api-contract.yml"

jobs:
  openapi-drift:
    name: OpenAPI contract is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches python:3.11-slim in docker/Dockerfile.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # inaiera-gateway-auth (pyproject.toml) resolves from a private repo —
      # same credential the Docker build takes as its gh_token secret.
      - name: Install the service
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          python -m pip install --upgrade pip
          pip install .

      # Building the schema only walks the route table: no Postgres, Redis or
      # upstream services are needed (env defaults live in the script).
      - name: Export OpenAPI from app.main:app
        run: python scripts/export_openapi.py "$RUNNER_TEMP/workspace.json"

      - name: Compare with the committed contract
        run: |
          if ! diff -u openapi/workspace.json "$RUNNER_TEMP/workspace.json"; then
            echo "::error file=openapi/workspace.json::OpenAPI contract drift — run 'python scripts/export_openapi.py openapi/workspace.json', commit it, and refresh the frontend snapshot + generated types."
            exit 1
          fi
