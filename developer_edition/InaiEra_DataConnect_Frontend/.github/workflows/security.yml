name: Security — dependencies, image, SBOM

# Mirrors the backend's security.yml (see InaiEra_DataConnect_Backend/docs/SUPPLY_CHAIN.md). Runs weekly as well as on changes: a package that was
# clean when merged can have an advisory published later with no code change to trigger CI.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm — advisories + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # What the container ships: the runtime/ package set (see Dockerfile). Any moderate-or-higher advisory fails the job.
      - name: Audit — shipped runtime dependencies
        working-directory: runtime
        run: npm ci --omit=dev && npm audit --omit=dev --audit-level=moderate
      # Everything in the production dependency tree of the app.
      - name: Audit — production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      # Build-time/dev tooling: REPORTED, not blocking. Any accepted advisory is listed (with expiry) in
      # InaiEra_DataConnect_Backend/docs/SUPPLY_CHAIN.md (currently none).
      - name: Audit — all dependencies (report only)
        run: npm audit || true
      - name: CycloneDX SBOM (production dependencies)
        run: npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file sbom-frontend.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend-npm
          path: sbom-frontend.cdx.json

  image:
    name: Frontend image — vulnerability scan + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dataconnect-frontend:scan .
      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: dataconnect-frontend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (image, CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: dataconnect-frontend:scan
          format: cyclonedx-json
          output-file: sbom-frontend-image.cdx.json
          artifact-name: sbom-frontend-image
