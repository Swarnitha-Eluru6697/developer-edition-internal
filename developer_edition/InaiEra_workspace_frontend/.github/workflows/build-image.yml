# Builds the InaiEra image(s) for this repo on every push to dev and uploads them to GHCR.
# Tag format: 1.0.0-<first 7 characters of the commit>, same as the setup guide.
# Run it by hand for any branch from the Actions tab (workflow_dispatch).
name: Build image

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tag
        id: t
        run: echo "tag=1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push workspace-frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/aadhyaanalyticsinc/inaiera/workspace-frontend:${{ steps.t.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
