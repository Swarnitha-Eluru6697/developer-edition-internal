# Standalone/compose config for the ML Studio web image: static files only.
# It proxies nothing — the API is reached through Envoy (in the data plane
# /mlstudio/api/ -> mlstudio-backend:4000), which verifies the user's ticket and
# sets the identity and permission headers. The backend refuses (401) any
# request that did not come through Envoy, so an nginx /api/ proxy would only
# produce 401s. Same content rules as nginx.dataplane.conf, which the image uses.

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The federation entry point. Called out explicitly because it is the one
  # file the HOST fetches rather than the browser loading this SPA directly:
  # if it ever falls through to the SPA fallback below, the host receives
  # index.html with a 200 and fails with an opaque module-parse error instead
  # of a 404 that would point at the real problem.
  location = /assets/remoteEntry.js {
    default_type text/javascript;
    # The remote is rebuilt on every deploy and its name is stable, so it must
    # not be cached as immutable the way the hashed chunks beside it are.
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Hashed build output. A miss here must be a 404, NOT the SPA fallback below:
  # served index.html with a 200, a missing chunk reaches the federating host as
  # HTML-parsed-as-JavaScript, and the failure surfaces as an opaque syntax
  # error pointing nowhere near the bad deploy that caused it.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
