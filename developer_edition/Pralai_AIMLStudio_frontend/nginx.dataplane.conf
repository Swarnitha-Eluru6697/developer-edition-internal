# Production config for AI/ML Studio when it runs as a Module-Federation REMOTE
# inside the data plane (service `mlstudio-frontend`). Mount it over the image's
# template, as the kit does: /etc/nginx/templates/default.conf.template.
#
# Distinct from ./nginx.conf, which is the standalone/compose config: that one
# proxies /api/ to the backend itself. In the data plane Envoy does all routing
# (/mlstudio/ -> here, /mlstudio/api/ -> mlstudio-backend:4000) and injects the
# identity headers, so this server only serves dist/ and proxies nothing.
#
# remoteEntry.js and index.html have fixed names, so they must be revalidated on
# every load or a new deploy stays invisible behind the browser cache. The
# hashed chunks change name when they change, so they are cached hard. A missing
# chunk is a 404, never the SPA fallback: served index.html with a 200, the host
# would get HTML parsed as JavaScript and an error pointing nowhere near the
# real cause.

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = /assets/remoteEntry.js {
    default_type text/javascript;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback for standalone browsing of the remote.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
