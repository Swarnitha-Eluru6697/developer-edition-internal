# ==============================================================================
# Flink configuration for the self-contained single-image standalone cluster.
# JobManager + TaskManager + SQL Gateway all run inside this one container and
# talk to each other over localhost.
#
# Override any value at runtime with FLINK_PROPERTIES (the Flink base image
# appends them to this file), e.g.:
#   -e FLINK_PROPERTIES="taskmanager.numberOfTaskSlots: 8"
# ==============================================================================

# ── JobManager ────────────────────────────────────────────────────────────────
jobmanager.rpc.address: localhost
jobmanager.bind-host: localhost
jobmanager.rpc.port: 6123
jobmanager.memory.process.size: 1600m

# ── TaskManager ────────────────────────────────────────────────────────────────
taskmanager.bind-host: localhost
taskmanager.host: localhost
taskmanager.memory.process.size: 2048m
taskmanager.numberOfTaskSlots: 4

parallelism.default: 1

# ── REST / Web UI (JobManager) ─────────────────────────────────────────────────
# Bind on all interfaces so the port can be published to the host, but advertise
# localhost internally (SQL Gateway + Runner API reach it over loopback).
rest.address: localhost
rest.bind-address: 0.0.0.0
rest.port: 8081

# ── Checkpointing / state (local filesystem by default) ─────────────────────────
execution.checkpointing.interval: 10s
state.backend: hashmap
state.checkpoints.dir: file:///tmp/flink-checkpoints
state.savepoints.dir: file:///tmp/flink-savepoints

# ── SQL Gateway ─────────────────────────────────────────────────────────────────
sql-gateway.endpoint.rest.address: 0.0.0.0
sql-gateway.endpoint.rest.port: 8083
sql-gateway.session.idle-timeout: 30min
