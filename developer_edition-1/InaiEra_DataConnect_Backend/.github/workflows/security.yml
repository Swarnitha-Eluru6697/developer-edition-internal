name: Security — dependencies, images, SBOM

# Supply-chain checks (docs/SUPPLY_CHAIN.md). Separate from ci.yml on purpose: it also runs on a schedule, because a dependency that was
# clean when it was merged can have a CVE published next week — with no code change to trigger a normal CI run.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "17 3 * * 1"      # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  python-dependencies:
    name: Python — known vulnerabilities + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install the project (no tooling yet)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          pip install -e .
          rm -f ~/.gitconfig
      # The SBOM is taken BEFORE the scanners are installed, from an isolated tool run, so it describes what the product ships — not
      # pip-audit's own dependencies.
      - name: CycloneDX SBOM
        run: |
          mkdir -p sbom
          pipx run --spec cyclonedx-bom cyclonedx-py environment "$(which python)" --of JSON -o sbom/backend.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-backend-python
          path: sbom/backend.cdx.json
      # Fails the job on ANY known vulnerability in the resolved environment. The private gateway-auth package is not on PyPI, so it is
      # reported as "skipped" (not failed); everything else is checked against the PyPI/OSV advisory databases.
      - name: pip-audit
        run: |
          pip install pip-audit
          python -m pip_audit --skip-editable --progress-spinner off

  image:
    name: Backend image — vulnerability scan + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: docker build --secret id=gh_token,env=GH_TOKEN -t dataconnect-backend:scan .
      # HIGH/CRITICAL with an available fix fail the job; unfixed ones are reported, not blocking (there is nothing to upgrade to).
      # Accepted exceptions live in .trivyignore with a reason and an expiry date — never silently.
      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: dataconnect-backend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: SBOM (image, CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: dataconnect-backend:scan
          format: cyclonedx-json
          output-file: sbom-backend-image.cdx.json
          artifact-name: sbom-backend-image

  operational-images:
    name: Pinned third-party images — vulnerability scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgres:16-alpine
          - redis:7-alpine
          - confluentinc/cp-kafka:7.6.0
          - confluentinc/cp-schema-registry:7.6.0
          - confluentinc/cp-kafka-connect:7.6.0
          - prom/prometheus:v2.53.2
    steps:
      - uses: actions/checkout@v4
      # Scanned by the pinned tag the compose files reference (tests/test_image_pinning.py guarantees each also carries a digest).
      # These are upstream images we cannot rebuild, so this job REPORTS (exit-code 0) and the findings drive a deliberate version bump.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
