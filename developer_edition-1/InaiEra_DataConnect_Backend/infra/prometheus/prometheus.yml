# Prometheus for the local DataConnect stack — scrapes every Kafka Connect worker's JMX exporter (:9404).
#
# DataConnect's backend queries this Prometheus (DATACONNECT_PROMETHEUS_URL) for the Monitoring page's per-connector
# metrics; it never scrapes the workers itself. Each target carries a `pool` label (the worker pool id from
# app/core/connect_pools.py) so a series can be traced back to the cluster that ran it.
#
# The pool workers only exist with `docker compose --profile pools up`; without it their targets just show as down
# here, and every connector runs on the shared `kafka-connect` worker.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # DataConnect's own metrics (operations, quality workers — app/core/metrics.py). Separate from the Connect workers below.
  - job_name: dataconnect
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: kafka-connect
    metrics_path: /metrics
    static_configs:
      - targets: ["kafka-connect:9404"]
        labels: {pool: shared}
      - targets: ["connect-cdc:9404"]
        labels: {pool: connect-cdc-pool}
      - targets: ["connect-jdbc:9404"]
        labels: {pool: connect-jdbc-pool}
      - targets: ["connect-file:9404"]
        labels: {pool: connect-file-pool}
      - targets: ["connect-api:9404"]
        labels: {pool: connect-api-pool}
      - targets: ["connect-stream:9404"]
        labels: {pool: connect-stream-pool}
      - targets: ["connect-sink:9404"]
        labels: {pool: connect-sink-pool}
