# =============================================================================
# dagster-dbt-runner Helm values
# =============================================================================

# -- Container image for all Dagster components (code-server, daemon, webserver)
image:
  repository: registry.inaiera.com/products/dbt-runner-dagster
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Org this data plane serves. It names the dbt Runner Service (dbt-runner-<orgId>), so Dagster
# can find it (DG-005). Use the same value as the dbt Runner / Workspace charts.
tenant:
  orgId: ""

# -- Deployment target passed as DAGSTER_DEPLOYMENT_TARGET env var.
#    "prod" → DbtRunnerClient reads from EnvVar() (k8s Secrets).
deploymentTarget: prod

# -----------------------------------------------------------------------------
# Dagster metadata database (Postgres)
# Either (a) postgresql.enabled=false and an external database below (RDS...; the production setup), or
# (b) postgresql.enabled=true: the chart deploys ONE in-cluster Postgres (StatefulSet + PVC + Service + NetworkPolicy, DG-004).
# (b) is for small / evaluation installs: a single replica, no backups, no failover. With neither, the chart refuses to render.
# -----------------------------------------------------------------------------
postgresql:
  enabled: false

  # In-cluster database (postgresql.enabled=true only). The password comes from external.passwordSecretRef below (the Secret must
  # exist already); user and database name from external.user / external.database.
  internal:
    image:
      repository: postgres
      tag: "16-alpine"
      pullPolicy: IfNotPresent
    persistence:
      size: 10Gi
      storageClass: ""        # empty = the cluster's default StorageClass
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {memory: 1Gi}

  # The external database (postgresql.enabled=false: host REQUIRED). passwordSecretRef is used by BOTH modes.
  external:
    host: ""
    port: 5432
    database: dagster
    user: dagster
    # Name of an existing k8s Secret with key "password"
    passwordSecretRef:
      name: dagster-pg-secret
      key: password

# -----------------------------------------------------------------------------
# dbt Runner connection.
#
# NOTE (DG-001): this chart deploys ONE generic code location whose job has no sensors or schedules,
# so Dagster does not schedule dbt projects here. The dbt Runner's own scheduler does
# (runner chart: scheduler.enabled=true, the default). Do not disable it unless per-repo locations
# with project_schedule_sensor are deployed; the runner chart refuses that without
# scheduler.externalOrchestrator. See DEPLOYMENT.md, "Who schedules dbt projects".
# -----------------------------------------------------------------------------
dbtRunner:
  # Normally leave EMPTY: the URL is computed as the Service the dbt Runner chart creates,
  #   http://dbt-runner-<tenant.orgId>.<namespace>.svc.cluster.local   (Service port 80 -> pod 8080)
  # (DG-005). Set a full URL only for a runner reachable some other way (a different release name, an
  # external host); an explicit value wins and is used as given.
  baseUrl: ""
  # Namespace the dbt Runner release lives in. Empty = this release's namespace.
  namespace: ""
  # The runner chart's service.port.
  servicePort: 80

  # Dagster's OWN signing key for the dbt Runner's /internal routes (DBT-003). Every request carries a fresh,
  # short-lived JWT signed with it (iss/sub "dagster", aud "dbtrunner", this tenant.orgId, ONE scope:
  # dbt.projects.read | dbt.runs.read | dbt.runs.trigger | dbt.runs.cancel). Same value as the runner chart's
  # schedulerJwt.secretRef. It must NOT be the runner's static internal token (that token opens only
  # POST /validate now and Dagster no longer holds it). An existing k8s Secret.
  schedulerJwtSecretRef:
    name: dbtrunner-scheduler-jwt
    key: secret

# -----------------------------------------------------------------------------
# Code server (gRPC)
# -----------------------------------------------------------------------------
codeServer:
  replicaCount: 1
  port: 4000

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # NOTE (DG-009): there is no Git credential setting here, on purpose. The code server never talks to Git: the git sensor asks the dbt
  # Runner for each project's current commit (GET /internal/projects/{id}/head), and the Runner owns the repository credentials
  # (credential_ref / GIT_CREDENTIAL_<REF>) and the Git egress. A private repository is configured on the RUNNER, once.

  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Daemon
# -----------------------------------------------------------------------------
daemon:
  replicaCount: 1    # Keep at 1; Dagster daemon is not HA.

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Webserver
# -----------------------------------------------------------------------------
webserver:
  replicaCount: 1
  port: 3000

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  service:
    type: ClusterIP      # only ClusterIP is accepted (values.schema.json): LoadBalancer/NodePort would publish the UI with no auth
    port: 3000

  # The Dagster webserver / GraphQL API is an ORCHESTRATION ADMIN SURFACE and has no authentication
  # of its own: whoever reaches it can launch runs, reload code locations and edit schedules (DG-002).
  #
  # Default = internal only: no Ingress, and a NetworkPolicy (see networkPolicy below) that admits no
  # inbound traffic, so it is reached with `kubectl port-forward` by cluster admins.
  #
  # To publish the UI, put an authentication layer in FRONT of it and say which one:
  #   auth.mode: gateway     the InAiEra Envoy gateway (jwt_authn) fronts the ingress, with an ADMIN-ONLY
  #                          route policy on this host (e.g. an RBAC rule on x-user-roles). That policy lives in the
  #                          gateway's config, outside this chart, and cannot be verified here.
  #   auth.mode: oidc-proxy  an SSO proxy via ingress-nginx external auth; the annotations
  #                          nginx.ingress.kubernetes.io/auth-url and .../auth-signin are then REQUIRED.
  # Either way the chart insists on className, a real host, TLS, and auth.fromNamespace (the namespace
  # of that gateway / ingress controller): the webserver pod then accepts traffic from that namespace
  # only, so the auth layer can't be bypassed by calling the Service or pod directly.
  # `helm lint` / `template` / `install` fail closed on anything less (values.schema.json).
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: dagster.example.com   # placeholder: must be replaced when enabled
    tls: []
    auth:
      mode: ""            # "gateway" | "oidc-proxy"
      fromNamespace: ""   # namespace of the gateway / ingress controller allowed to reach the webserver

  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Shared Dagster storage paths (inside containers)
# -----------------------------------------------------------------------------
storage:
  computeLogsDir: /var/lib/dagster/compute-logs
  artifactsDir: /var/lib/dagster/artifacts

# Storage (DG-019). No ReadWriteOnce volume is ever shared between Deployments: a RWO volume attaches to ONE node, so
# pods scheduled on different nodes (or a rollout starting a pod before the old one released the volume) would sit in
# ContainerCreating with a Multi-Attach error. Each volume goes only to the pods that use it:
#   compute logs   written by the code server (its run/step processes), shown by the webserver -> must be SHARED:
#                  mode rwx : one ReadWriteMany PVC mounted by the code server and the webserver ONLY (needs an RWX
#                             storageClass: NFS, EFS, Azure Files, CephFS...; the chart refuses to guess one), or
#                  mode s3  : Dagster's S3ComputeLogManager (S3 or any S3-compatible store); no PVC, the pods only stage
#                             logs locally; credentials via persistence.computeLogs.s3.credentialsSecretRef or an
#                             IAM-for-service-accounts annotation on serviceAccount.annotations
#   artifacts      step outputs inside one run, used only by the code server -> a ReadWriteOnce PVC mounted by the code
#                  server ALONE (its Deployment uses strategy Recreate, so the old pod releases it first; therefore
#                  codeServer.replicaCount must be 1 while persistence.enabled)
#   daemon, webserver (artifacts), everything when persistence.enabled=false: emptyDir (the instance only needs the
#                  directories to exist). With persistence.enabled=false and mode rwx the UI cannot show step logs.
persistence:
  enabled: true
  computeLogs:
    mode: rwx                    # rwx | s3
    size: 10Gi
    storageClass: ""             # REQUIRED for mode rwx while persistence.enabled: a ReadWriteMany class
    s3:
      bucket: ""                 # required for mode s3
      prefix: dagster-compute-logs
      region: ""
      endpointUrl: ""            # S3-compatible stores (MinIO, Ceph...); empty = AWS
      useSsl: true
      # Static keys from an existing Secret; leave name empty to use IAM roles for service accounts instead.
      credentialsSecretRef:
        name: ""
        accessKeyIdKey: access-key-id
        secretAccessKeyKey: secret-access-key
  artifacts:
    size: 5Gi
    storageClass: ""

# -----------------------------------------------------------------------------
# Service account
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

# NetworkPolicies (DG-002, DG-020). Every Dagster pod is DEFAULT-DENY in both directions, then:
#   webserver  in: webserver.ingress.auth.fromNamespace only (nothing while the ingress is disabled)
#              out: DNS, Postgres, the code server (gRPC 4000)
#   daemon     in: nothing                         out: DNS, Postgres, the code server
#   code       in: gRPC from the webserver and the daemon only
#              out: DNS, Postgres, the dbt Runner (no Git: the git sensor asks the Runner for commits, DG-009)
# It cannot be disabled while the ingress is enabled (values.schema.json). Needs a CNI that enforces
# NetworkPolicy (Calico, Cilium, ...); on one that does not, the policies are silently ignored.
networkPolicy:
  enabled: true
  dns:
    to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
  # The EXTERNAL Dagster metadata database (postgresql.external.*; ignored when postgresql.enabled=true, where the rule targets the
  # in-cluster pod). Default: the dp-shared namespace; point `to` at wherever it lives (a namespaceSelector / podSelector / ipBlock list).
  postgres:
    ports: [5432]
    to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: dp-shared
  # The dbt Runner. `ports` are the runner POD's ports (the Service's 80 maps to 8080). Empty `to` = the runner's namespace
  # (dbtRunner.namespace, else this release's); set it for a runner reachable some other way (an external host).
  dbtRunner:
    ports: [8080]
    to: []
