{{- $component := "daemon" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dagster-dbt-runner.fullname" . }}-daemon
  labels:
    {{- include "dagster-dbt-runner.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ .Values.daemon.replicaCount }}   # Must be 1; daemon is not HA
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dagster-dbt-runner.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dagster-dbt-runner.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      serviceAccountName: {{ include "dagster-dbt-runner.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: daemon
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - dagster-daemon
            - run
          env:
            {{- include "dagster-dbt-runner.commonEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "dagster-dbt-runner.commonVolumeMounts" . | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - dagster-daemon
                - liveness-check
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.daemon.resources | nindent 12 }}
      volumes:
        {{- include "dagster-dbt-runner.volumes" (dict "ctx" . "sharesLogs" false "ownsArtifacts" false) | nindent 8 }}
      {{- with .Values.daemon.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemon.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemon.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
