---
# Code server (gRPC) — internal only
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dagster-dbt-runner.fullname" . }}-code
  labels:
    {{- include "dagster-dbt-runner.labels" . | nindent 4 }}
    app.kubernetes.io/component: code-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "dagster-dbt-runner.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: code-server
  ports:
    - name: grpc
      port: 4000
      targetPort: grpc
      protocol: TCP

---
# Webserver — exposed via Ingress or LoadBalancer
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dagster-dbt-runner.fullname" . }}-webserver
  labels:
    {{- include "dagster-dbt-runner.labels" . | nindent 4 }}
    app.kubernetes.io/component: webserver
spec:
  type: {{ .Values.webserver.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "dagster-dbt-runner.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: webserver
  ports:
    - name: http
      port: {{ .Values.webserver.service.port }}
      targetPort: http
      protocol: TCP
