# Dagster instance configuration.
# Mount this file to $DAGSTER_HOME/dagster.yaml in every Dagster container.
#
# For the full reference, see:
# https://docs.dagster.io/deployment/dagster-instance
#
# In local dev this file is mounted via docker-compose volume.
# In production (k8s) it is rendered from the Dagster Helm chart configmap.

storage:
  postgres:
    postgres_db:
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      hostname:
        env: DAGSTER_PG_HOST
      db_name:
        env: DAGSTER_PG_DB
      port:
        env: DAGSTER_PG_PORT

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 10
    tag_concurrency_limits: []

compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir:
      env: DAGSTER_COMPUTE_LOGS_DIR

local_artifact_storage:
  module: dagster.core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir:
      env: DAGSTER_ARTIFACTS_DIR

# Sensor evaluation interval — how often the daemon wakes and evaluates sensors.
# Individual sensors also set minimum_interval_seconds; whichever is larger wins.
sensors:
  use_threads: true
  num_workers: 4

# Keep 30 days of run history in the metadata DB.
retention:
  schedule:
    purge_after_days: 30
  sensor:
    purge_after_days: 30
