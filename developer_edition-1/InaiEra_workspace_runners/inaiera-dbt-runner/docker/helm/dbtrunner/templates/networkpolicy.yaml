{{- if .Values.networkPolicy.enabled }}
# --- API pod: ingress only from allowed callers; egress only to DNS and the
# configured dependency ports (metadata DB, k8s API, JWKS, artifact store,
# UCS / Datasets).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dbtrunner.fullname" . }}-api
  labels:
    {{- include "dbtrunner.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dbtrunner.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
      {{- with .Values.networkPolicy.api.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        {{- range .Values.networkPolicy.api.egressPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- with .Values.networkPolicy.api.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if eq .Values.runner.mode "k8s_job" }}
---
# --- Run Job pods (customer dbt code): NO ingress; egress only to DNS, git,
# the warehouse, the artifact store (and UCS only if configured) — each an explicit destination (DBT-010).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dbtrunner.fullname" . }}-job
  namespace: {{ .Values.runner.namespace }}
  labels:
    {{- include "dbtrunner.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dbtrunner.jobPodLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- $j := .Values.networkPolicy.job }}
    {{- if $j.allowPublicInternet }}
    # UNSAFE dev-only opt-in (refused outside dev): public addresses on the git/artifact ports, never the private/metadata ranges.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml $j.denyCidrs | nindent 14 }}
      ports:
        {{- range (concat $j.git.ports $j.artifactStore.ports | uniq) }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if $j.git.proxy.url }}
    # git (and dbt deps) go through the FQDN-allow-listing egress proxy; Job pods may reach ONLY the proxy for it.
    - to:
        {{- toYaml $j.git.proxy.to | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $j.git.proxy.port }}
    {{- else if $j.git.to }}
    # git: exactly these hosts
    - to:
        {{- toYaml $j.git.to | nindent 8 }}
      ports:
        {{- range $j.git.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if $j.warehouse.to }}
    # warehouse (Trino / pg_lake): exactly these endpoints
    - to:
        {{- toYaml $j.warehouse.to | nindent 8 }}
      ports:
        {{- range $j.warehouse.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if $j.artifactStore.to }}
    # artifact store (S3-compatible): exactly these endpoints
    - to:
        {{- toYaml $j.artifactStore.to | nindent 8 }}
      ports:
        {{- range $j.artifactStore.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if and .Values.jobs.workspace.enabled $j.workspace.to }}
    # Workspace: a SQL job on a connection sends its statements there (one-run token, no credentials in the pod)
    - to:
        {{- toYaml $j.workspace.to | nindent 8 }}
      ports:
        {{- range $j.workspace.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if and .Values.jobs.python.pipIndexUrl $j.packageIndex.to }}
    # package index: where a Python job's requirements.txt is installed from
    - to:
        {{- toYaml $j.packageIndex.to | nindent 8 }}
      ports:
        {{- range $j.packageIndex.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.job.ucs }}
    # UCS (only if explicitly configured)
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.networkPolicy.job.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
