[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "inaiera-dbt-runner"
version = "0.1.0"
description = "InAiEra dbt Runner — registers, validates, schedules, and runs dbt projects against the lakehouse (data plane)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "gitpython>=3.1",
  "structlog>=24.1",
  "tenacity>=8.2",
  "croniter>=2.0",
  "dbt-core~=1.10.0",
  "dbt-trino~=1.10.0",
  "dbt-postgres~=1.10.0",
  "dbt-clickhouse~=1.10.0",
  "clickhouse-connect>=0.8",
  "kubernetes>=29.0",
  # S3-compatible durable artifact store for run results (app/services/artifact_store.py)
  "boto3>=1.34",
  # NOTE: the PyPI name is openlineage-dbt (the patch bundle said "dbt-openlineage",
  # which does not exist). It ships a `dbt-ol` CLI wrapper, NOT an in-process hook.
  "openlineage-dbt>=1.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.3",
  "mypy>=1.9",
  "aiosqlite>=0.20",
  "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
