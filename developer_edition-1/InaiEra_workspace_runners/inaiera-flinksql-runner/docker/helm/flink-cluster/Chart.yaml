apiVersion: v2
name: inaiera-flink-cluster
description: |
  Apache Flink session cluster for the InAiEra FlinkSQL Runner service.
  Deployed via the Flink Kubernetes Operator. Includes:
    - Flink session cluster (JobManager + TaskManagers)
    - Flink SQL Gateway (REST endpoint for multi-statement SQL sessions)
    - Reactive mode autoscaling (TaskManagers scale with demand)
    - KEDA ScaledObject for Kafka-lag-based TaskManager scaling
    - Checkpoint state backend wired to the same object storage as Workspace
type: application
version: 0.1.0
appVersion: "1.19.1"
dependencies:
  - name: flink-kubernetes-operator
    version: "1.9.0"
    repository: "https://downloads.apache.org/flink/flink-kubernetes-operator-1.9.0/"
    condition: operator.enabled
