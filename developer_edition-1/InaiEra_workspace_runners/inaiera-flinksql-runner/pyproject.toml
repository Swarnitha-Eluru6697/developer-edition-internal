[project]
name = "inaiera-flinksql-runner"
version = "0.1.0"
description = "InAiEra FlinkSQL Runner — streaming transformation layer (Kafka → Lakehouse)"
# 3.10 floor: the apache/flink base image ships Debian bullseye / Python 3.10.
# The code targets 3.10+ (PEP 604 unions work at runtime; no 3.11-only features).
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "structlog>=24.1",
  "tenacity>=8.2",
  "kafka-python>=2.0",   # quality_consumer reads the violations topic
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.3",
  "aiosqlite>=0.20",
  "cryptography>=42",
]
# Runtime deps needed only inside the container image.
# psycopg2-binary: sync driver used by Alembic (migrations/env.py strips
#   the +asyncpg suffix and runs migrations over a synchronous connection).
# gunicorn: optional production process manager for uvicorn workers.
prod = [
  "psycopg2-binary>=2.9",
  "gunicorn>=22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
