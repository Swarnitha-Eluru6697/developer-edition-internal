name: CI

# Backend test suite on every push/PR. Includes tests/test_helm_contract.py,
# which renders the chart (helm is installed below) and checks its env keys
# and deployment shape against the app — so app and chart can't drift apart.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (incl. Helm contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches python:3.11-slim in docker/Dockerfile.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"

      # inaiera-gateway-auth resolves from a private repo (see docker/Dockerfile).
      - name: Install
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          pip install ".[dev]"
          git config --global --unset url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf

      - name: Tests
        run: python -m pytest -q

  integration:
    name: pytest -m integration (Postgres + Redis + MinIO)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: workspace
          POSTGRES_DB: workspace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workspace" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      minio:
        image: bitnami/minio:2024
        env:
          MINIO_ROOT_USER: workspace
          MINIO_ROOT_PASSWORD: workspaceminio
          MINIO_DEFAULT_BUCKETS: inaiera-workspace-files
        ports: ["9000:9000"]
    env:
      INTEGRATION_DATABASE_URL: postgresql+asyncpg://workspace:workspace@localhost:5432/workspace
      REDIS_URL: redis://localhost:6379/0
      STORAGE_BACKEND: s3
      STORAGE_BUCKET: inaiera-workspace-files
      STORAGE_ENDPOINT_URL: http://localhost:9000
      AWS_ACCESS_KEY_ID: workspace
      AWS_SECRET_ACCESS_KEY: workspaceminio
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          pip install ".[dev]"
          git config --global --unset url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf
      - name: Migrate
        run: DATABASE_URL="$INTEGRATION_DATABASE_URL" alembic upgrade head
      - name: Integration tests
        run: python -m pytest -q -m integration
