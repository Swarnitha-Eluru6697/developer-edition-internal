[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "inaiera-workspace"
version = "0.1.0"
description = "InAiEra Workspace service (data plane)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "gitpython>=3.1",
  "pygithub>=2.3",
  "python-gitlab>=4.4",
  "azure-devops>=7.1.0b4",
  "boto3>=1.34",
  "azure-storage-blob[aio]>=12.19",  # aio extra pulls aiohttp, needed by azure.storage.blob.aio
  "azure-keyvault-secrets>=4.8",
  "azure-identity>=1.15",
  "google-cloud-storage>=2.16",
  "google-cloud-secret-manager>=2.20",
  "nbformat>=5.10",
  # Local Python cell execution (dev / self-hosted fallback when JupyterHub
  # isn't configured) — runs cells in an in-process IPython kernel.
  "jupyter_client>=8.6",
  "ipykernel>=6.29",
  "structlog>=24.1",
  "tenacity>=8.2",
  "inaiera-gateway-auth @ git+https://github.com/AadhyaAnalyticsInc/InaiEra_dataplane_GatewayAuth.git@v1.1.0-rc.1#subdirectory=python",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.3",
  "mypy>=1.9",
  "aiosqlite>=0.20",
  "cryptography>=42",
  "pyyaml>=6.0",   # tests/test_helm_contract.py
  "fakeredis>=2.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs a real, migrated Postgres + Redis + object store (INTEGRATION_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py311"
