# Static files only. This server serves the built React app (dist/) and
# proxies nothing: the API (/api, /mcp, /embed.js) is reached through
# Envoy, which verifies the user's ticket and sets the identity and
# permission headers itself. A proxy here would be a second path to the
# backend that bypasses that gateway. (In local dev, vite.config.ts's
# dev-server proxy forwards those paths instead.)
#
# SPA fallback (try_files ... /index.html): the app uses client-side
# routing, so a direct request to a client-side route must still resolve
# to index.html rather than a 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build output (vite emits assets/index-<hash>.js).
    # The name changes whenever the content does, so these are safe to
    # cache indefinitely and never need revalidating.
    location /assets/ {
        # One header, not two: `expires 1y` emits its own Cache-Control
        # (max-age=31536000), so pairing it with an add_header sent the
        # response out with two competing Cache-Control lines.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The federation entry point has a fixed filename, so it must be
    # revalidated on every load or a new deploy is invisible to returning
    # browsers (see nginx.dataplane.conf). Exact match wins over /assets/.
    location = /assets/remoteEntry.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # index.html is the POINTER to those hashed assets, so it must
        # never be cached: served with no Cache-Control at all, browsers
        # fall back to heuristic caching and keep re-loading a stale
        # index.html that references the PREVIOUS bundle. A rebuilt and
        # redeployed frontend then appears not to have changed at all —
        # the app keeps running old code with no error to explain it,
        # which is exactly how a fixed UI can look unfixed.
        #
        # "no-cache" rather than "no-store": the browser must revalidate
        # every time, but a 304 is still allowed, so this costs one
        # conditional request rather than a full re-download.
        add_header Cache-Control "no-cache" always;
        etag on;
    }
}
