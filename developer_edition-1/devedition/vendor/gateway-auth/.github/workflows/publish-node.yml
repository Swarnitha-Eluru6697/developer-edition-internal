# Publishes @aadhyaanalyticsinc/gateway-auth to GitHub Packages.
#
# The package scope must match the organisation that owns the repository —
# that is a GitHub Packages rule, and it is why the package is named
# @aadhyaanalyticsinc/gateway-auth rather than @inaiera/gateway-auth.
#
# Triggered by pushing a tag such as node-v1.0.0, so a publish is always tied
# to a specific commit and the version is never guessed.
name: Publish gateway-auth (Node)

on:
  push:
    tags: ["node-v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # lets GITHUB_TOKEN publish; no stored secret needed
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@aadhyaanalyticsinc"

      - run: npm ci || npm install
      - run: npm run build
      - run: npm test

      # Confirm the tag and package.json agree before publishing. Without this,
      # a mistyped tag publishes a version nobody expects and the mistake is
      # only visible later, in a consumer's lockfile.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#node-v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG"; exit 1
          fi

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
